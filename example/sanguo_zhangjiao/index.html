<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张角黄巾起义序章 - 第一幕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #gameCanvas {
            border: 2px solid #4CAF50;
            background-color: #2a2a2a;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #tutorial-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 40px;
            border-radius: 15px;
            border: 3px solid #2196F3;
            pointer-events: auto;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.5);
            animation: fadeIn 0.3s ease-in;
        }
        
        #tips-panel {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 16px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            pointer-events: none;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            animation: fadeIn 0.3s ease-in;
        }
        
        /* 隐藏提示标题（“提示”字样） */
        #tips-title {
            display: none;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        #tutorial-panel h3 {
            color: #2196F3;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        #tips-panel h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        #tutorial-panel p {
            font-size: 14px;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 20px;
        }
        
        #tips-panel p {
            font-size: 14px;
            line-height: 1.3;
            color: #ffffff;
            margin: 0;
        }
        
        #tutorial-panel .key {
            display: inline-block;
            background: #2196F3;
            color: #000;
            padding: 3px 9px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            margin: 0 3px;
        }
        
        #tips-panel .key {
            display: inline-block;
            background: #4CAF50;
            color: #000;
            padding: 3px 9px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            margin: 0 3px;
        }
        
        #tutorial-panel .tutorial-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        
        #tutorial-panel button {
            padding: 10px 20px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        #tutorial-panel button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        #tutorial-panel button:active {
            transform: translateY(0);
        }
        
        #tutorial-panel button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        #tutorial-panel .step-indicator {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
        }
        
        #controls-hint {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .hidden {
            display: none !important;
        }
        
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        
        #loading-screen h1 {
            color: #4CAF50;
            margin-bottom: 20px;
        }
        
        .progress-bar {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s;
        }
        
        /* 技能栏样式 */
        #skill-bar {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        
        .skill-slot {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #4CAF50;
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .skill-slot:hover {
            border-color: #8BC34A;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.5);
        }
        
        .skill-slot.on-cooldown {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .skill-slot.on-cooldown:hover {
            transform: none;
            box-shadow: none;
        }
        
        .skill-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .skill-hotkey {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            color: #4CAF50;
            font-weight: bold;
        }
        
        .skill-cooldown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border-radius: 6px;
        }
        
        .skill-name {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #aaa;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .skill-slot:hover .skill-name {
            opacity: 1;
        }
        
        .skill-mana-cost {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #2196F3;
            font-weight: bold;
        }
        
        /* ============ 屏幕触控按钮（移动端 / 触屏） ============ */
        #touch-controls {
            position: absolute;
            inset: 0;
            pointer-events: none; /* 容器不拦截，子按钮各自开启 */
            z-index: 500;
            display: none; /* 默认隐藏，触屏设备显示 */
        }
        
        #touch-controls.active {
            display: block;
        }
        
        /* 背包打开时触屏控件让位：DOM 按钮在 canvas 之上，
           否则必然压住 Canvas 绘制的背包。
           applyUILayoutToDom 会把按钮重挂到 #touch-controls，
           未重挂时仍在 #action-buttons / #bottom-hotbar，两种都要覆盖。 */
        body.backpack-open #touch-controls > .action-btn,
        body.backpack-open #touch-controls > .hotbar-btn:not(#hb-bag),
        body.backpack-open #touch-controls > .potion-btn,
        body.backpack-open #touch-controls > #joystick-zone,
        body.backpack-open #action-buttons .action-btn,
        body.backpack-open #bottom-hotbar .hotbar-btn:not(#hb-bag),
        body.backpack-open #joystick-zone,
        body.backpack-open #dpad {
            opacity: 0.08 !important;
            pointer-events: none !important;
        }
        
        /* 左下角虚拟摇杆区域（透明圆形热区） */
        #joystick-zone {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 30%;
            max-width: 280px;
            height: 55%;
            pointer-events: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            z-index: 0;
        }
        
        #joystick-canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        
        /* 摇杆绘制层：覆盖整个游戏容器（与主 canvas 同尺寸），避免旋转坐标换算 */
        #joystick-overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 600;
        }
        
        /* ===== 右侧动作按钮组：外圈3技能 + 中心攻击 + 轻功 + 投掷 ===== */
        #action-buttons {
            position: absolute;
            right: -16px;
            bottom: 12px;
            width: 220px;
            height: 220px;
            pointer-events: none;
        }
        
        .action-btn {
            position: absolute;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            font-size: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: background 0.1s;
        }
        
        .action-btn .label {
            font-size: 10px;
            margin-top: 2px;
            color: #ddd;
        }
        
        .action-btn.pressed {
            background: rgba(33, 150, 243, 0.7);
            border-color: #64b5f6;
        }
        
        /* 中心：攻击（最大） */
        .action-btn.attack {
            font-size: 26px;
            background: rgba(200, 60, 40, 0.6);
            border-color: rgba(255, 120, 90, 0.85);
        }
        .action-btn.attack.pressed { background: rgba(200, 60, 40, 0.9); }
        
        /* 攻击放在按钮组中心 */
        #act-attack  { right: 66px; bottom: 70px; }
        /* 格挡按钮：攻击按钮下方 */
        #act-block   { right: 66px; bottom: 0px; }
        /* 外侧3个技能：水平翻转后的位置 */
        #act-skill3  { right: 154px; bottom: 84px; }
        #act-skill4  { right: 114px; bottom: 150px; }
        #act-skill5  { right: 38px;  bottom: 156px; }
        
        /* 技能按钮冷却遮罩（扇形逐渐消退，模仿 PC 技能栏） */
        .action-btn.skill {
            overflow: hidden;
        }
        .action-btn.move {
            overflow: hidden;
        }
        .skill-cd-overlay {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            pointer-events: none;
            display: none;
            z-index: 2;
        }
        .action-btn.skill.on-cd .skill-cd-overlay,
        .action-btn.move.on-cd .skill-cd-overlay {
            display: block;
        }
        .action-btn.skill.on-cd,
        .action-btn.move.on-cd {
            opacity: 0.65;
            border-color: rgba(255, 255, 255, 0.2);
        }
        .skill-cd-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 4px #000, 0 0 4px #000;
            pointer-events: none;
            display: none;
            z-index: 3;
        }
        .action-btn.skill.on-cd .skill-cd-text,
        .action-btn.move.on-cd .skill-cd-text {
            display: block;
        }
        
        /* 中心左下：轻功 */
        .action-btn.move {
            font-size: 18px;
            background: rgba(60, 120, 200, 0.55);
            border-color: rgba(120, 170, 240, 0.8);
        }
        .action-btn.move.pressed { background: rgba(60, 120, 200, 0.9); }
        /* 跳跃位于轻功下方（无编辑器布局时的兜底位置） */
        #act-jump { right: 150px; bottom: -64px; }
        /* 轻功与投掷底部对齐 */
        #act-flight { right: 150px; bottom: 0px; }
        /* 交互按钮：投掷左边 */
        #act-interact { right: 88px; bottom: 0px; }
        /* 中心右侧：投掷（向左移动 20px → right 增大 20） */
        #act-throw  { right: 20px;   bottom: 0px; }
        /* 斧头按钮：投掷右边 */
        #act-axe    { right: -48px;  bottom: 0px; }
        
        /* ===== 底部快捷栏：背包 / 装备 / 技能6 / 技能7（无边框，按钮+文字） ===== */
        #bottom-hotbar {
            position: absolute;
            left: 50%;
            bottom: 8px;
            transform: translateX(-50%);
            display: flex;
            gap: 28px;
            pointer-events: none;
            z-index: 10;
        }
        .hotbar-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            /* 无边框、无背景 */
        }
        .hotbar-btn .hb-icon {
            font-size: 30px;
            line-height: 1;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }
        .hotbar-btn .hb-label {
            font-size: 12px;
            margin-top: 3px;
            color: #eee;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }
        .hotbar-btn.pressed { opacity: 0.6; }
        
        /* 药瓶按钮：PC 风格图标 + 右下角剩余数量 */
        .hotbar-btn.potion-btn {
            position: relative;
        }
        .hotbar-btn .hb-canvas {
            width: 44px;
            height: 44px;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
            pointer-events: none;
        }
        .hotbar-btn .hb-count {
            position: absolute;
            right: -2px;
            bottom: -2px;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 3px #000, 0 0 3px #000;
            pointer-events: none;
        }
        
        /* ============ 竖屏时强制以横屏方式显示页面（不锁定方向，仅 CSS 旋转） ============ */
        #game-container {
            transform-origin: center center;
        }
        
        /* 触屏 + 竖屏：把容器旋转 90°，并将宽高对调以填满屏幕 */
        body.force-landscape #game-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
        }

        /* ============ 登录/系统菜单（启动时位于加载页面之前） ============ */
        #login-screen {
            position: absolute;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111 center/cover no-repeat;
            pointer-events: auto;
        }
        #login-screen.hidden { display: none; }
        /* 关闭“显示描述文字”时，仅隐藏标题、副标题与文字描述，保留菜单和存档信息。 */
        #login-screen.text-hidden #login-title,
        #login-screen.text-hidden #login-subtitle,
        #login-screen.text-hidden #login-description { display: none; }
        #login-panel {
            width: min(460px, 88vw);
            padding: 34px 42px;
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            text-align: center;
            backdrop-filter: none;
            position: relative;
            transition: width .2s ease;
        }
        /* 初始登录页不显示框；游戏内系统菜单仍使用独立的小面板。 */
        #login-screen:not(.in-game) #login-panel {
            background: transparent !important;
            border: 0 !important;
            box-shadow: none !important;
            backdrop-filter: none !important;
        }
        #login-screen.in-game #login-panel {
            border: 1px solid rgba(255,255,255,.22);
            border-radius: 12px;
            box-shadow: 0 18px 60px rgba(0,0,0,.65);
            backdrop-filter: blur(5px);
            background: var(--login-panel-color, rgba(15, 15, 18, .88));
        }
        .login-layout { display: block; }
        .login-main-column { min-width: 0; text-align: center; }
        #login-title { margin-bottom: 8px; font-size: 32px; color: #e7c778; }
        #login-subtitle { margin-bottom: 14px; font-size: 18px; color: #eee; }
        #login-description { margin-bottom: 24px; line-height: 1.7; color: #bbb; white-space: pre-line; }
        #login-footer {
            position: absolute;
            /* top: calc(100% + 14px); */
            left: 50%;
            width: max-content;
            max-width: min(460px, 92vw);
            transform: translateX(-50%);
            color: rgba(255,255,255,.78);
            font-size: 12px;
            line-height: 1.6;
            text-align: center;
            pointer-events: auto;
        }
        #login-footer p { margin: 0; }
        #login-footer p + p { margin-top: 6px; }
        #login-footer a { color: inherit; text-decoration: none; }
        #login-footer a:hover, #login-footer a:focus-visible { color: #e7c778; text-decoration: underline; }
        #login-screen.in-game #login-footer { display: none; }

        /* 新建、读档、手动存档在独立小窗中执行，不扩展登录菜单。 */
        #save-picker-modal {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(0,0,0,.56);
        }
        .save-picker-panel {
            position: relative;
            display: grid;
            gap: 12px;
            width: min(640px, 94vw);
            max-height: min(78vh, 650px);
            padding: 26px;
            overflow: auto;
            border: 1px solid rgba(218,185,112,.48);
            border-radius: 12px;
            background: rgba(15,15,18,.95);
            box-shadow: 0 20px 64px rgba(0,0,0,.72);
            color: #eee;
        }
        #save-picker-title { margin: 0; padding-right: 28px; color: #e7c778; font-size: 21px; }
        #save-picker-close {
            position: absolute;
            top: 8px;
            right: 12px;
            border: 0;
            background: none;
            color: #ddd;
            font-size: 26px;
            cursor: pointer;
        }
        #new-game-profile {
            display: grid;
            gap: 10px;
            margin: 0;
            width: min(300px, 100%);
            color: #eee;
            text-align: left;
        }
        .new-game-field { display: grid; grid-template-columns: 48px 1fr; gap: 8px; align-items: center; font-size: 13px; }
        .new-game-field input {
            min-width: 0;
            padding: 8px 9px;
            border: 1px solid rgba(255,255,255,.28);
            border-radius: 4px;
            background: rgba(0,0,0,.42);
            color: #fff;
            font: inherit;
        }
        .new-game-gender { display: flex; align-items: center; gap: 12px; margin: 0; padding: 0; border: 0; }
        .new-game-gender legend { padding: 0; font-size: 13px; }
        .new-game-gender label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; font-size: 13px; }
        #new-game-gender-note { min-height: 18px; margin: 0; color: #ffd166; font-size: 12px; line-height: 1.4; }
        .login-actions { display: grid; gap: 12px; justify-items: center; }
        .login-action {
            width: min(230px, 100%);
            white-space: nowrap;
        }
        .login-action, .save-picker-confirm, .save-picker-cancel {
            padding: 12px 18px;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 6px;
            color: #fff;
            background: #4b6728;
            font: inherit;
            cursor: pointer;
        }
        .save-picker-cancel { background: rgba(255,255,255,.12); }
        .save-picker-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .login-action:disabled { cursor: not-allowed; opacity: .5; filter: grayscale(1); }
        .login-action:not(:disabled):hover, .save-picker-confirm:hover, .save-picker-cancel:hover { filter: brightness(1.18); }
        #login-manual-save, #login-return-game { display: none; }
        #login-screen.in-game #login-manual-save, #login-screen.in-game #login-return-game { display: block; }
        #save-slots { display: none; gap: 9px; min-width: 0; text-align: left; }
        #save-slots.visible { display: grid; }
        #save-slot-browser-label { color: #e7c778; font-size: 14px; }
        #save-picker-message { min-height: 18px; margin: 0; color: #ffd166; font-size: 12px; line-height: 1.5; }
        @media (max-width: 540px) {
            #save-picker-modal { padding: 12px; }
            .save-picker-panel { padding: 20px 16px; max-height: 86vh; }
        }
        .save-slot-browser {
            border: 1px solid rgba(194,157,86,.45); background: linear-gradient(135deg, rgba(20,18,15,.97), rgba(43,35,25,.97));
            box-shadow: inset 0 0 32px rgba(0,0,0,.3); border-radius: 3px;
        }
        .save-slot-summary {
            padding: 9px 12px; border-bottom: 1px solid rgba(194,157,86,.28); color: #d8c49a;

    <script type="module">
        import { DataDrivenScene } from './scenes/DataDrivenScene.js';

        import { SceneManager } from '../../src/core/SceneManager.js';

        import { AttributePanel } from '../../src/ui/AttributePanel.js';

        import { ItemIconRenderer } from '../../src/ui/ItemIconRenderer.js';
        import { SaveGameService } from '../../src/core/snapshot/SaveGameService.js';
        import { PortraitsConfig } from './data/PortraitsConfig.js';
        import { SelectedCharacterStore } from './data/SelectedCharacterStore.js';
        
        // 场景管理器
        let sceneManager = null;
        let assetManager = null;
        
        // UI组件
        let dialogueBox = null;
        let skillTreePanel = null;
        let notificationSystem = null;
        let inventoryPanel = null;
        let attributePanel = null;
        let playerInfoPanel = null;
        
        // 游戏状态
        let scene = null;
        let lastTime = performance.now();
        let fps = 60;
        let frameCount = 0;
        let fpsTime = 0;
        let projectConfig = null;
        let gameStarted = false;
        let activeSaveSlot = 1; // 当前选择的手动栏位；自动存档使用三个独立轮换栏位。
        let autosaveTimer = null;
        const AUTO_SAVE_INTERVAL_MS = 15 * 60 * 1000;
        const saveGames = new SaveGameService({ gameId: 'sanguo_zhangjiao', slotCount: 100 });
        const SAVE_FILES_ROOT = 'example/sanguo_zhangjiao/saves';
        const SAVE_SLOT_ID_PATTERN = /^(?:autosave-[1-3]|slot-(?:[1-9]\d?|100))$/;
        
        // 获取元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Canvas 自适应容器大小
        function resizeCanvas() {
            const rotate = document.body.classList.contains('force-landscape');
            let cw, ch;
            if (rotate) {
                // 旋转模式：容器 CSS 宽=100vh，高=100vw，即逻辑宽为屏幕高，逻辑高为屏幕宽
                cw = window.innerHeight;
                ch = window.innerWidth;
            } else {
                const container = canvas.parentElement;
                cw = container ? container.clientWidth : window.innerWidth;
                ch = container ? container.clientHeight : window.innerHeight;
            }
            canvas.width = cw;
            canvas.height = ch;
            
            // 通知当前场景更新尺寸
            if (sceneManager) {
                sceneManager.setRenderSize(cw, ch);
                const currentScene = sceneManager.getCurrentScene();
                if (currentScene && currentScene.onResize) {
                    currentScene.onResize(cw, ch);
                }
            }
        }
        // 首次加载时检测是否需要竖屏旋转，确保第一帧尺寸正确
        (function initForceLandscape() {
            const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            const portrait = window.innerHeight > window.innerWidth;
            if (isTouch && portrait) {
                document.body.classList.add('force-landscape');
            }
        })();
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const loadingScreen = document.getElementById('loading-screen');
        const progressFill = document.getElementById('progress-fill');
        const loadingText = document.getElementById('loading-text');
        const tutorialPanel = document.getElementById('tutorial-panel');
        const tutorialTitle = document.getElementById('tutorial-title');
        const tutorialText = document.getElementById('tutorial-text');
        const tutorialNextBtn = document.getElementById('tutorial-next-btn');
        const tutorialPrevBtn = document.getElementById('tutorial-prev-btn');
        const tutorialStepIndicator = document.getElementById('tutorial-step-indicator');
        
        const tipsPanel = document.getElementById('tips-panel');
        const tipsTitle = document.getElementById('tips-title');
        const tipsText = document.getElementById('tips-text');

        const loginScreen = document.getElementById('login-screen');
        const loginPanel = document.getElementById('login-panel');
        const loginTitle = document.getElementById('login-title');
        const loginSubtitle = document.getElementById('login-subtitle');
        const loginDescription = document.getElementById('login-description');
        const loginMessage = document.getElementById('login-message');
        const savePickerModal = document.getElementById('save-picker-modal');
        const savePickerTitle = document.getElementById('save-picker-title');
        const savePickerMessage = document.getElementById('save-picker-message');
        const savePickerCancel = document.getElementById('save-picker-cancel');
        const savePickerClose = document.getElementById('save-picker-close');
        const saveSlotsElement = document.getElementById('save-slots');
        let savePickerOpener = null;
        const NEW_GAME_DEFAULT_NICKNAME = '柔弱女子';
        const newGameProfile = document.getElementById('new-game-profile');
        const newGameNickname = document.getElementById('new-game-nickname');
        const newGameGenderFemale = document.getElementById('new-game-gender-female');
        const newGameGenderMale = document.getElementById('new-game-gender-male');
        const newGameGenderNote = document.getElementById('new-game-gender-note');

        function applyNewGameProfile() {
            const nickname = newGameNickname.value.trim().slice(0, 16) || NEW_GAME_DEFAULT_NICKNAME;
            newGameNickname.value = nickname;
            SelectedCharacterStore.set({ ...SelectedCharacterStore.get(), name: nickname, gender: 'female' });
            return nickname;
        }

        newGameGenderFemale.addEventListener('change', () => {
            if (!newGameGenderFemale.checked) return;
            newGameGenderNote.textContent = '';
        });
        newGameGenderMale.addEventListener('change', () => {
            if (!newGameGenderMale.checked) return;
            newGameGenderFemale.checked = true;
            newGameGenderNote.textContent = '当前没有男角色的图片，只能选择女角色。';
        });

        async function loadProjectConfig() {
            if (projectConfig) return projectConfig;
            try {
                const response = await fetch('game.project.json');
                if (response.ok) projectConfig = await response.json();
            } catch (error) {
                console.warn('读取项目配置失败，使用登录页默认值', error);
            }
            return projectConfig || {};
        }

        function applyLoginConfig(config = {}) {
            if (config.title) loginTitle.textContent = config.title;
            if (config.subtitle) loginSubtitle.textContent = config.subtitle;
            if (config.description) loginDescription.textContent = config.description;
            const showDescription = config.showDescription ?? config.showText ?? true;
            loginScreen.classList.toggle('text-hidden', showDescription === false);
            if (config.backgroundColor) loginScreen.style.backgroundColor = config.backgroundColor;
            if (config.backgroundImage) {
                const safeUrl = String(config.backgroundImage).replace(/["'()]/g, '');
                loginScreen.style.backgroundImage = `url("${safeUrl}")`;
            } else {
                loginScreen.style.backgroundImage = 'none';
            }
            if (config.textColor) {
                loginPanel.style.color = config.textColor;
                loginDescription.style.color = config.textColor;
            }
            if (config.titleColor) loginTitle.style.color = config.titleColor;
            loginPanel.style.removeProperty('background');
            if (config.panelColor) loginPanel.style.setProperty('--login-panel-color', config.panelColor);
            else loginPanel.style.removeProperty('--login-panel-color');
            if (config.buttonColor) {
                document.querySelectorAll('.login-action').forEach(button => { button.style.background = config.buttonColor; });
            }
        }

        // 登录页独立布局：PC 与 Android 分别由 UI 编辑器保存，
        // 不与游戏内 PC/Android HUD 布局混用。
        const LOGIN_LAYOUT_FILES = Object.freeze({
            desktop: 'LoginLayout.desktop.json',
            mobile: 'LoginLayout.mobile.json'
        });
        const LEGACY_LOGIN_LAYOUT_FILE = 'LoginLayout.json';
        const loginLayouts = new Map();
        const LOGIN_LAYOUT_IDS = ['login-panel', 'login-title', 'login-subtitle', 'login-description', 'login-actions'];

        function getLoginLayoutPlatform() {
            return PlatformProfile.isMobile ? 'mobile' : 'desktop';
        }

        async function loadLoginLayout(platform) {
            const cached = loginLayouts.get(platform);
            if (cached) return cached;
            const fileNames = [LOGIN_LAYOUT_FILES[platform], LEGACY_LOGIN_LAYOUT_FILE];
            for (const fileName of fileNames) {
                try {
                    const response = await fetch(`config/${fileName}`);
                    if (!response.ok) continue;
                    const loaded = await response.json();
                    if (!Array.isArray(loaded?.components)) continue;
                    loginLayouts.set(platform, loaded);
                    return loaded;
                } catch (_error) {
                    // 文件不存在或读取失败时继续尝试兼容布局；最终回退到 CSS 默认布局。
                }
            }
            return null;
        }

        function clearLoginLayout() {
            for (const id of LOGIN_LAYOUT_IDS) {
                const element = document.getElementById(id);
                if (!element) continue;
                for (const property of ['position', 'left', 'top', 'width', 'height', 'margin', 'display', 'justify-items']) {
                    element.style.removeProperty(property);
                }
            }
            loginPanel.querySelectorAll('.login-action').forEach(button => {
                button.style.removeProperty('width');
                button.style.removeProperty('height');
                button.style.removeProperty('padding');
            });
        }

        function getLoginLayoutRect(component, layout, width, height) {
            const canvasWidth = Number(layout.canvas?.width) || width;
            const canvasHeight = Number(layout.canvas?.height) || height;
            const xPct = Number.isFinite(component.xPct) ? component.xPct : (Number(component.x) || 0) / canvasWidth;
            const yPct = Number.isFinite(component.yPct) ? component.yPct : (Number(component.y) || 0) / canvasHeight;
            const wPct = Number.isFinite(component.wPct) ? component.wPct : (Number(component.width) || 0) / canvasWidth;
            const hPct = Number.isFinite(component.hPct) ? component.hPct : (Number(component.height) || 0) / canvasHeight;
            return {
                x: Math.round(xPct * width),
                y: Math.round(yPct * height),
                width: Math.round(wPct * width),
                height: Math.round(hPct * height)
            };
        }

        /** 应用 UI 编辑器保存的对应平台登录页布局；独立存档弹窗不参与登录页布局。 */
        async function applyLoginLayout() {
            if (loginScreen.classList.contains('in-game')) {
                clearLoginLayout();
                return false;
            }
            const loginLayout = await loadLoginLayout(getLoginLayoutPlatform());
            if (!loginLayout) return false; // 文件不存在时沿用 CSS 回退布局

            const componentMap = new Map(loginLayout.components.map(component => [component.id, component]));
            const panelComponent = componentMap.get('login-panel');
            if (!panelComponent) return false;
            const width = loginScreen.clientWidth || window.innerWidth;
            const height = loginScreen.clientHeight || window.innerHeight;
            const panelRect = getLoginLayoutRect(panelComponent, loginLayout, width, height);
            loginPanel.style.position = 'absolute';
            loginPanel.style.left = `${panelRect.x}px`;
            loginPanel.style.top = `${panelRect.y}px`;
            loginPanel.style.width = `${panelRect.width}px`;
            loginPanel.style.height = `${panelRect.height}px`;

            for (const id of LOGIN_LAYOUT_IDS.slice(1)) {
                const component = componentMap.get(id);
                const element = document.getElementById(id);
                if (!component || !element) continue;
                const rect = getLoginLayoutRect(component, loginLayout, width, height);
                element.style.position = 'absolute';
                element.style.left = `${rect.x - panelRect.x}px`;
                element.style.top = `${rect.y - panelRect.y}px`;
                element.style.width = `${rect.width}px`;
                element.style.height = `${rect.height}px`;
                element.style.margin = '0';
                if (id === 'login-actions') {
                    element.style.display = 'grid';
                    element.style.justifyItems = 'center';
                    element.querySelectorAll('.login-action').forEach(button => {
                        button.style.width = '100%';
                        button.style.height = '100%';
                        button.style.padding = '0';
                    });
                }
            }
            return true;
        }

        // 系统菜单打开/关闭时，自动在响应式布局与编辑器登录布局之间切换。
        const refreshLoginLayout = () => { void applyLoginLayout(); };
        new MutationObserver(refreshLoginLayout)
            .observe(loginPanel, { attributes: true, attributeFilter: ['class'] });
        new MutationObserver(refreshLoginLayout)
            .observe(loginScreen, { attributes: true, attributeFilter: ['class'] });

        function setLoginMessage(message = '') {
            loginMessage.textContent = message;
            if (!savePickerModal.classList.contains('hidden')) savePickerMessage.textContent = message;
        }

        function formatSaveTime(timestamp) {
            if (!timestamp) return '未知时间';
            try { return new Date(timestamp).toLocaleString('zh-CN', { hour12: false }); }
            catch (_error) { return '未知时间'; }
        }

        let savePickerMode = null;
        let selectedSaveValue = '';
        let savePickerEntries = [];
        let autoSaveInFlight = null;
        const saveSlotSelected = document.getElementById('save-slot-selected');
        const saveSlotList = document.getElementById('save-slot-list');
        const saveSlotInfo = document.getElementById('save-slot-info');
        const saveSlotConfirm = document.getElementById('save-slot-confirm');

        function autoSaveSelection(index) {
            return `auto:${index}`;
        }

        function manualSaveSelection(index) {
            return `manual:${index}`;
        }

        function parseSaveSelection(value) {
            const autoMatch = /^auto:(\d+)$/.exec(String(value || ''));
            const autoIndex = Number(autoMatch?.[1]);
            if (Number.isInteger(autoIndex) && autoIndex >= 1 && autoIndex <= saveGames.autoSlotCount) {
                return { kind: 'auto', index: autoIndex };
            }
            const manualMatch = /^manual:(\d+)$/.exec(String(value || ''));
            const manualIndex = Number(manualMatch?.[1]);
            return Number.isInteger(manualIndex) && manualIndex >= 1 && manualIndex <= saveGames.slotCount
                ? { kind: 'manual', index: manualIndex }
                : null;
        }

        /** 自动档与手动档统一按保存时间挑选，继续游戏始终恢复最近有效进度。 */
        function getLatestSaveSelection() {
            const latest = [...saveGames.getAutoSlots(), ...saveGames.listSlots()]
                .filter(entry => entry.exists && entry.info)
                .sort((left, right) => {
                    const timeDelta = (Number(right.info.createdAt) || 0) - (Number(left.info.createdAt) || 0);
                    if (timeDelta) return timeDelta;
                    const typeDelta = left.type.localeCompare(right.type);
                    return typeDelta || left.index - right.index;
                })[0];
            return latest ? { kind: latest.type, index: latest.index } : null;
        }

        function refreshContinueGameAction() {
            const button = document.getElementById('login-continue');
            const selection = getLatestSaveSelection();
            button.disabled = !selection;
            button.title = selection ? '读取最近保存的游戏进度' : '没有可读取的有效存档';
            return selection;
        }

        function describeSaveEntry(entry, label) {
            if (!entry?.exists) return `${label}为空`;
            const meta = entry.info?.meta || {};
            return `${label}：${meta.characterName || '未命名角色'}，等级 ${meta.level || 1}，保存于 ${formatSaveTime(entry.info?.createdAt)}`;
        }

        function getSavePickerEntry(value = selectedSaveValue) {
            return savePickerEntries.find(entry => entry.value === value) || null;
        }

        function moveSaveSelection(direction) {
            const options = savePickerEntries.filter(entry => !entry.disabled);
            if (!options.length) return;
            const currentIndex = options.findIndex(entry => entry.value === selectedSaveValue);
            const nextIndex = (currentIndex + direction + options.length) % options.length;
            selectSaveEntry(options[nextIndex]?.value, { focus: true });
        }

        function selectSaveEntry(value, { focus = false } = {}) {
            const selected = getSavePickerEntry(value);
            if (!selected || selected.disabled) return false;
            selectedSaveValue = value;
            saveSlotSelected.textContent = selected.label;
            for (const entry of savePickerEntries) {
                const isSelected = entry.value === value;
                entry.element.classList.toggle('selected', isSelected);
                entry.element.setAttribute('aria-selected', String(isSelected));
            }
            selected.element.scrollIntoView({ block: 'nearest' });
            if (focus) selected.element.focus();
            updateSavePickerInfo();
            return true;
        }

        function updateSavePickerInfo() {
            const selection = parseSaveSelection(selectedSaveValue);
            const selected = getSavePickerEntry();
            if (!selection || !selected) return;
            saveSlotInfo.textContent = describeSaveEntry(selected.entry, selected.shortLabel);
            saveSlotConfirm.disabled = savePickerMode === 'continue' && !selected.entry.exists;
        }

        function buildSavePreview(entry, typeLabel) {
            const preview = document.createElement('div');
            preview.className = 'save-slot-preview';
            const savedPreview = entry.info?.meta?.preview;
            if (typeof savedPreview === 'string' && savedPreview.startsWith('data:image/')) {
                const image = document.createElement('img');
                image.src = savedPreview;
                image.alt = `${typeLabel}游戏画面`;
                preview.appendChild(image);
            }
            const type = document.createElement('span');
            type.className = 'save-slot-type';
            type.textContent = typeLabel;
            preview.appendChild(type);
            return preview;
        }

        /** 巫师式存档浏览：缩略图、分类、区域、等级与时间以固定卡片列表展示。 */
        function renderSaveSlots(mode) {
            savePickerMode = mode;
            const isNewGame = mode === 'new';
            newGameProfile.classList.toggle('hidden', !isNewGame);
            if (isNewGame) {
                if (!newGameNickname.value.trim()) newGameNickname.value = NEW_GAME_DEFAULT_NICKNAME;
                newGameGenderFemale.checked = true;
                newGameGenderNote.textContent = '';
            }
            const manualSlots = saveGames.listSlots();
            const autoSlots = saveGames.getAutoSlots();
            savePickerEntries = [];
            saveSlotList.replaceChildren();

            function addGroup(label) {
                const group = document.createElement('div');
                group.className = 'save-slot-group';
                group.textContent = label;
                saveSlotList.appendChild(group);
            }

            function addOption(value, entry, shortLabel) {
                const disabled = mode === 'continue' && !entry.exists;
                const meta = entry.info?.meta || {};
                const option = document.createElement('div');
                const label = describeSaveEntry(entry, shortLabel);
                option.className = `save-slot-option${disabled ? ' disabled' : ''}`;
                option.tabIndex = disabled ? -1 : 0;
                option.setAttribute('role', 'option');
                option.setAttribute('aria-disabled', String(disabled));
                option.setAttribute('aria-selected', 'false');

                const details = document.createElement('div');
                details.className = 'save-slot-details';
                const title = document.createElement('div');
                title.className = 'save-slot-title';
                title.textContent = entry.exists
                    ? `${shortLabel} · ${meta.characterName || '未命名角色'}`
                    : `${shortLabel} · 空白栏位`;
                const location = document.createElement('div');
                location.className = 'save-slot-location';
                location.textContent = entry.exists
                    ? (meta.location || `第 ${meta.currentAct || 1} 幕区域`)
                    : (mode === 'continue' ? '没有可读取的进度' : '在此开始新的旅程');
                const cardMeta = document.createElement('div');
                cardMeta.className = 'save-slot-meta';
                const level = document.createElement('span');
                level.textContent = entry.exists ? `等级 ${meta.level || 1}` : '未创建';
                const time = document.createElement('time');
                time.textContent = entry.exists ? formatSaveTime(entry.info?.createdAt) : '—';
                cardMeta.append(level, time);
                details.append(title, location, cardMeta);
                option.append(buildSavePreview(entry, shortLabel), details);
                option.addEventListener('click', () => selectSaveEntry(value));
                option.addEventListener('keydown', event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        selectSaveEntry(value);
                    } else if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
                        event.preventDefault();
                        moveSaveSelection(event.key === 'ArrowDown' ? 1 : -1);
                    }
                });
                saveSlotList.appendChild(option);
                savePickerEntries.push({ value, entry, shortLabel, label, disabled, element: option });
            }

            if (mode === 'continue') {
                addGroup('自动存档（保留最近 3 份）');
                for (const slot of autoSlots) addOption(autoSaveSelection(slot.index), slot, `自动 ${slot.index}`);
            }

            addGroup('手动存档');
            for (const slot of manualSlots) addOption(manualSaveSelection(slot.index), slot, `手动 ${slot.index}`);

            const firstManual = manualSlots.find(slot => slot.exists);
            const latestAuto = saveGames.getLatestAutoSlot();
            const preferred = mode === 'continue'
                ? (latestAuto ? autoSaveSelection(latestAuto.index) : firstManual ? manualSaveSelection(firstManual.index) : '')
                : manualSaveSelection(activeSaveSlot);
            if (preferred) selectSaveEntry(preferred);
            else {
                selectedSaveValue = '';
                saveSlotSelected.textContent = '没有可读取的存档';
                saveSlotInfo.textContent = '存档为空，请选择 开始游戏。';
                saveSlotConfirm.disabled = true;
            }
            saveSlotConfirm.textContent = mode === 'continue' ? '读取所选存档'
                : (mode === 'manualSave' ? '保存到所选手动栏位' : '开始新游戏');
            if (!isSavePickerOpen()) {
                savePickerOpener = document.activeElement instanceof HTMLElement ? document.activeElement : null;
            }
            savePickerTitle.textContent = mode === 'continue' ? '读取存档'
                : (mode === 'manualSave' ? '手动存档' : '开始新游戏');
            savePickerMessage.textContent = loginMessage.textContent;
            saveSlotsElement.classList.add('visible');
            savePickerModal.classList.remove('hidden');
            savePickerModal.setAttribute('aria-hidden', 'false');
            menuPadIndex = 0;
            requestAnimationFrame(() => {
                if (isSavePickerOpen()) getSavePickerEntry()?.element.focus();
            });
        }

        function isSavePickerOpen() {
            return !savePickerModal.classList.contains('hidden');
        }

        function closeSavePicker({ restoreFocus = true } = {}) {
            const opener = savePickerOpener;
            savePickerModal.classList.add('hidden');
            savePickerModal.setAttribute('aria-hidden', 'true');
            saveSlotsElement.classList.remove('visible');
            newGameProfile.classList.add('hidden');
            savePickerMode = null;
            selectedSaveValue = '';
            savePickerEntries = [];
            savePickerMessage.textContent = '';
            saveSlotSelected.textContent = '请选择存档栏位';
            saveSlotInfo.textContent = '';
            saveSlotConfirm.disabled = false;
            menuPadIndex = 0;
            savePickerOpener = null;
            if (restoreFocus && opener?.isConnected && !loginScreen.classList.contains('hidden')) opener.focus();
        }

        /** 生成不依赖主画布的保底缩略图，保证每个磁盘存档目录始终有图片文件。 */
        function createFallbackSavePreview() {
            const preview = document.createElement('canvas');
            preview.width = 240;
            preview.height = 135;
            const previewContext = preview.getContext('2d');
            const gradient = previewContext.createLinearGradient(0, 0, preview.width, preview.height);
            gradient.addColorStop(0, '#6b4c27');
            gradient.addColorStop(1, '#182920');
            previewContext.fillStyle = gradient;
            previewContext.fillRect(0, 0, preview.width, preview.height);
            previewContext.fillStyle = 'rgba(255,255,255,.72)';
            previewContext.font = 'bold 18px sans-serif';
            previewContext.fillText('张角黄巾起义序章', 18, 65);
            previewContext.font = '12px sans-serif';
            previewContext.fillText('存档缩略图', 18, 88);
            return preview.toDataURL('image/jpeg', 0.45);
        }

        /** 将当前游戏画面压缩为存档缩略图；主画布不可导出时使用保底图片。 */
        function captureSavePreview() {
            if (!canvas?.width || !canvas?.height) return createFallbackSavePreview();
            try {
                const preview = document.createElement('canvas');
                preview.width = 240;
                preview.height = 135;
                preview.getContext('2d').drawImage(canvas, 0, 0, preview.width, preview.height);
                return preview.toDataURL('image/jpeg', 0.45);
            } catch (_error) {
                return createFallbackSavePreview();
            }
        }

        function currentSaveMeta() {
            const current = sceneManager?.getCurrentScene?.() || scene;
            const player = current?.playerEntity;
            const stats = player?.getComponent?.('stats');
            const name = player?.getComponent?.('name');
            const currentAct = current?.gameLoader?.blackboard?.get?.('act') || 1;
            return {
                characterName: name?.name || name?.displayName || player?.name || '张角',
                level: stats?.level || 1,
                currentAct,
                location: current?.locationName || `第 ${currentAct} 幕区域`,
                preview: captureSavePreview()
            };
        }

        function saveFilePath(slotId, fileName) {
            if (!SAVE_SLOT_ID_PATTERN.test(slotId)) throw new RangeError(`无效存档文件栏位: ${slotId}`);
            return `${SAVE_FILES_ROOT}/${slotId}/${fileName}`;
        }

        async function writeSaveFile(path, content, encoding = 'utf8') {
            try {
                const response = await fetch('/api/save-file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path, content, encoding })
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok || !payload.ok) {
                    return {
                        ok: false,
                        errors: [{ code: 'fileWriteFailed', path, message: payload.error || `文件保存失败 (${response.status})` }]
                    };
                }
                return { ok: true, errors: [] };
            } catch (error) {
                return {
                    ok: false,
                    errors: [{ code: 'fileWriteUnavailable', path, message: String(error?.message || error) }]
                };
            }
        }

        /** 将完整快照和对应缩略图镜像到 Demo 存档目录；浏览器缓存仍用于同步读档。 */
        async function persistSaveFiles(slotId, snapshot) {
            if (!snapshot) {
                return { ok: false, errors: [{ code: 'missingSnapshot', path: slotId, message: '没有可写入文件的存档快照' }] };
            }
            const diskSnapshot = JSON.parse(JSON.stringify(snapshot));
            const preview = diskSnapshot.meta?.preview;
            const previewMatch = typeof preview === 'string'
                ? /^data:image\/(jpeg|png|webp);base64,([A-Za-z0-9+/=]+)$/.exec(preview)
                : null;
            if (!previewMatch) {
                return { ok: false, errors: [{ code: 'missingPreview', path: slotId, message: '当前画面缩略图不可用，未写入存档文件' }] };
            }

            const extension = previewMatch[1] === 'jpeg' ? 'jpg' : previewMatch[1];
            delete diskSnapshot.meta.preview;
            diskSnapshot.meta.previewFile = `thumbnail.${extension}`;
            const snapshotPath = saveFilePath(slotId, 'snapshot.json');
            const thumbnailPath = saveFilePath(slotId, diskSnapshot.meta.previewFile);
            const thumbnailWrite = await writeSaveFile(thumbnailPath, previewMatch[2], 'base64');
            if (!thumbnailWrite.ok) return thumbnailWrite;
            const snapshotWrite = await writeSaveFile(snapshotPath, JSON.stringify(diskSnapshot, null, 2));
            if (!snapshotWrite.ok) return snapshotWrite;
            return { ok: true, errors: [], snapshotPath, thumbnailPath };
        }

        async function saveCurrentGame({ silent = false } = {}) {
            if (!gameStarted || !scene?.playerEntity) return null;
            const result = saveGames.save(activeSaveSlot, currentSaveMeta());
            if (!result.ok) {
                if (!silent) setLoginMessage('手动保存失败，请稍后重试。');
                console.warn('手动保存失败', result.errors);
                return result;
            }
            const fileResult = await persistSaveFiles(saveGames.slotId(activeSaveSlot), result.snapshot);
            const completed = { ...result, ok: fileResult.ok, filePersisted: fileResult.ok, errors: [...result.errors, ...fileResult.errors] };
            if (!silent) {
                setLoginMessage(fileResult.ok
                    ? `已手动保存到栏位 ${activeSaveSlot}`
                    : '手动存档已写入浏览器缓存，但存档文件或缩略图保存失败。');
            }
            if (!fileResult.ok) console.warn('手动存档文件保存失败', fileResult.errors);
            return completed;
        }

        /** 自动存档状态只通过游戏画面的 NotificationSystem 显示，不写入登录/系统菜单。 */
        function showAutoSaveStatus(message, type = 'info') {
            const current = sceneManager?.getCurrentScene?.() || scene;
            const notifier = current?.notificationSystem || notificationSystem;
            if (!notifier) return;
            if (type === 'success') notifier.addSuccess(message);
            else if (type === 'error') notifier.addError(message);
            else notifier.addNotification(message, 'info', 4500);
        }

        async function performAutoSave({ reason = 'unknown' } = {}) {
            showAutoSaveStatus('自动存档保存中...');
            const result = saveGames.saveAuto(currentSaveMeta());
            if (!result.ok) {
                showAutoSaveStatus('自动存档保存失败', 'error');
                console.warn('自动保存失败', { reason, errors: result.errors });
                return result;
            }
            const fileResult = await persistSaveFiles(result.autoSlotId, result.snapshot);
            const completed = {
                ...result,
                ok: fileResult.ok,
                filePersisted: fileResult.ok,
                errors: [...result.errors, ...fileResult.errors]
            };
            if (fileResult.ok) showAutoSaveStatus('自动存档保存成功', 'success');
            else {
                showAutoSaveStatus('自动存档保存失败', 'error');
                console.warn('自动存档文件保存失败', { reason, errors: fileResult.errors });
            }
            return completed;
        }

        /** 定时、剧情和地图切换共用同一把锁，避免并发覆盖同一自动栏位。 */
        function autoSaveCurrentGame(options = {}) {
            if (!gameStarted || !scene?.playerEntity) return Promise.resolve(null);
            if (autoSaveInFlight) return autoSaveInFlight;
            autoSaveInFlight = performAutoSave(options)
                .finally(() => { autoSaveInFlight = null; });
            return autoSaveInFlight;
        }

        async function confirmSavePicker() {
            const selection = parseSaveSelection(selectedSaveValue);
            if (!selection) return;
            const selected = getSavePickerEntry();
            const entry = selected?.entry;
            if (!entry) return;

            if (savePickerMode === 'continue') {
                if (!entry.exists) {
                    setLoginMessage('存档为空，请选择 开始游戏。');
                    return;
                }
                startGameFromSelection('continue', selection);
                return;
            }

            // 开始游戏与手动保存只能写入手动栏位，自动位绝不允许被覆盖。
            if (selection.kind !== 'manual') return;
            if (entry.exists && !confirm(`手动存档 ${selection.index} 已有进度，是否覆盖？`)) return;

            if (savePickerMode === 'manualSave') {
                activeSaveSlot = selection.index;
                const saved = await saveCurrentGame({ silent: true });
                setLoginMessage(saved?.ok ? `已手动保存到栏位 ${selection.index}`
                    : saved?.snapshot ? '手动存档已写入浏览器缓存，但存档文件或缩略图保存失败。'
                    : '手动保存失败，请稍后重试。');
                renderSaveSlots('manualSave');
                return;
            }
            if (savePickerMode === 'new') applyNewGameProfile();
            startGameFromSelection('new', selection);
        }

        function startGameFromSelection(mode, selection) {
            closeSavePicker({ restoreFocus: false });
            setLoginMessage('');
            if (gameStarted || sceneManager) {
                sessionStorage.setItem('yijian18:boot-command', JSON.stringify({ mode, selection }));
                location.reload();
                return;
            }
            if (selection.kind === 'manual') activeSaveSlot = selection.index;
            loginScreen.classList.add('hidden');
            loadingScreen.style.display = 'flex';
            initGame({ loadSave: mode === 'continue', saveSelection: selection });
        }

        async function openSystemMenu() {
            closeSavePicker({ restoreFocus: false });
            if (gameStarted) {
                await autoSaveCurrentGame({ reason: 'system-menu' });
                scene?.pause?.();
                loginScreen.classList.add('in-game');
            } else {
                loginScreen.classList.remove('in-game');
            }
            refreshContinueGameAction();
            setLoginMessage('');
            menuPadArmed = false;
            menuPadIndex = 0;
            loginScreen.classList.remove('hidden');
            document.getElementById('login-start').focus();
        }

        function closeSystemMenu() {
            if (!gameStarted) return;
            closeSavePicker({ restoreFocus: false });
            loginScreen.classList.add('hidden');
            loginScreen.classList.remove('in-game');
            scene?.resume?.();
            lastTime = performance.now();
        }

        async function exitGame() {
            await autoSaveCurrentGame({ reason: 'exit' });
            const app = globalThis.Capacitor?.Plugins?.App;
            if (app?.exitApp) {
                app.exitApp();
                return;
            }
            window.close();
            setLoginMessage('浏览器不允许网页主动关闭，请关闭当前标签页。');
        }

        document.getElementById('login-continue').addEventListener('click', () => {
            const selection = refreshContinueGameAction();
            if (!selection) {
                setLoginMessage('没有可读取的有效存档，请选择 开始游戏。');
                return;
            }
            startGameFromSelection('continue', selection);
        });
        document.getElementById('login-start').addEventListener('click', () => {
            setLoginMessage('请选择手动存档栏位（1–100）。');
            renderSaveSlots('new');
        });
        document.getElementById('login-read-save').addEventListener('click', () => {
            if (!saveGames.hasAny()) {
                closeSavePicker({ restoreFocus: false });
                setLoginMessage('存档为空，请选择 开始游戏。');
                return;
            }
            setLoginMessage('请选择自动存档或手动存档栏位。');
            renderSaveSlots('continue');
        });
        document.getElementById('login-manual-save').addEventListener('click', () => {
            setLoginMessage('请选择要写入的手动存档栏位（1–100）。');
            renderSaveSlots('manualSave');
        });
        document.getElementById('login-return-game').addEventListener('click', closeSystemMenu);
        saveSlotConfirm.addEventListener('click', confirmSavePicker);
        savePickerClose.addEventListener('click', () => closeSavePicker());
        savePickerCancel.addEventListener('click', () => closeSavePicker());
        savePickerModal.addEventListener('click', event => {
            if (event.target === savePickerModal) closeSavePicker();
        });
        document.getElementById('login-exit').addEventListener('click', exitGame);
        document.getElementById('login-close').addEventListener('click', closeSystemMenu);
        window.addEventListener('keydown', event => {
            if (event.key !== 'Escape' || loginScreen.classList.contains('hidden')) return;
            if (isSavePickerOpen()) {
                event.preventDefault();
                closeSavePicker();
                return;
            }
            if (loginScreen.classList.contains('in-game')) {
                event.preventDefault();
                closeSystemMenu();
            }
        });

        // 登录层不依赖场景 InputManager：初次启动和暂停状态下也可用手柄选择。
        let menuPadArmed = false;
        let menuPadDirection = 0;
        let menuPadIndex = 0;
        function pollLoginGamepad() {
            if (!loginScreen.classList.contains('hidden') && navigator.getGamepads) {
                const pad = Array.from(navigator.getGamepads()).find(Boolean);
                if (pad) {
                    const pressed = index => !!pad.buttons[index]?.pressed;
                    const direction = pressed(12) || (pad.axes[1] || 0) < -0.55 ? -1
                        : (pressed(13) || (pad.axes[1] || 0) > 0.55 ? 1 : 0);
                    const isPickingSave = saveSlotsElement.classList.contains('visible');
                    const active = isPickingSave
                        ? [saveSlotConfirm]
                        : Array.from(loginScreen.querySelectorAll('.login-action'))
                            .filter(button => button.offsetParent !== null && !button.disabled);
                    if (!menuPadArmed) {
                        menuPadArmed = !pressed(0) && !pressed(1) && !pressed(9) && direction === 0;
                    } else {
                        if (isPickingSave && direction && direction !== menuPadDirection) {
                            const options = savePickerEntries.filter(entry => !entry.disabled);
                            const currentIndex = options.findIndex(entry => entry.value === selectedSaveValue);
                            const nextIndex = (currentIndex + direction + options.length) % options.length;
                            selectSaveEntry(options[nextIndex]?.value);
                        } else if (!isPickingSave && direction && direction !== menuPadDirection && active.length) {
                            menuPadIndex = (menuPadIndex + direction + active.length) % active.length;
                            active[menuPadIndex].focus();
                        }
                        if (pressed(0) && !pollLoginGamepad.aWasDown) {
                            if (isPickingSave) void confirmSavePicker();
                            else active[menuPadIndex]?.click();
                        }
                        if ((pressed(1) || pressed(9)) && !pollLoginGamepad.cancelWasDown) {
                            if (isPickingSave) closeSavePicker();
                            else if (loginScreen.classList.contains('in-game')) closeSystemMenu();
                        }
                    }
                    menuPadDirection = direction;
                    pollLoginGamepad.aWasDown = pressed(0);
                    pollLoginGamepad.cancelWasDown = pressed(1) || pressed(9);
                }
            } else {
                menuPadArmed = false;
                menuPadDirection = 0;
                pollLoginGamepad.aWasDown = false;
                pollLoginGamepad.cancelWasDown = false;
            }
            requestAnimationFrame(pollLoginGamepad);
        }

        // 初始化游戏
        async function initGame(options = {}) {
            try {
                // 项目配置已在登录页阶段读取；加载页复用同一份配置。
                const project = await loadProjectConfig();
                const loadingConfig = project.system?.loading || null;

                // 应用加载页面配置
                if (loadingConfig) {
                    const ls = document.getElementById('loading-screen');
                    const h1 = ls?.querySelector('h1');
                    const h2 = ls?.querySelector('h2');
                    if (h1 && loadingConfig.title) h1.textContent = loadingConfig.title;
                    if (h2 && loadingConfig.subtitle) h2.textContent = loadingConfig.subtitle;
                    if (h1 && loadingConfig.titleColor) h1.style.color = loadingConfig.titleColor;
                    if (ls && loadingConfig.backgroundColor) ls.style.background = loadingConfig.backgroundColor;
                    if (loadingConfig.progressBarColor) {
                        const pf = document.getElementById('progress-fill');
                        if (pf) pf.style.background = `linear-gradient(90deg, ${loadingConfig.progressBarColor})`;
                    }
                    if (loadingConfig.icon) {
                        const iconEl = document.createElement('img');
                        iconEl.src = loadingConfig.icon;
                        iconEl.style.cssText = 'width:64px;height:64px;margin-bottom:16px;';
                        if (h1) h1.parentNode.insertBefore(iconEl, h1);
                    }
                    if (loadingConfig.loadingText) {
                        loadingText.textContent = loadingConfig.loadingText;
                    }
                }

                // 按配置的步骤加载，或使用默认步骤
                const steps = loadingConfig?.steps || [
                    { progress: 0, text: '初始化 ECS 系统...', delay: 500 },
                    { progress: 25, text: '加载核心系统...', delay: 500 },
                    { progress: 50, text: '创建场景管理器...', delay: 300 },
                    { progress: 60, text: '注册场景...', delay: 500 },
                    { progress: 75, text: '初始化玩家实体...', delay: 0 },
                    { progress: 90, text: '进入第一幕...', delay: 500 },
                    { progress: 100, text: '完成！', delay: 500 }
                ];
                let stepIndex = 0;
                const nextStep = async () => {
                    if (stepIndex < steps.length) {
                        const s = steps[stepIndex];
                        updateLoading(s.progress, s.text);
                        if (s.delay > 0) await sleep(s.delay);
                        stepIndex++;
                    }
                };

                // 模拟加载过程（按步骤推进）
                await nextStep(); // 步骤 0

                await nextStep(); // 步骤 1
                // 创建并初始化 AssetManager
                assetManager = new AssetManager();
                assetManager.setAssetBasePath('assets/');
                assetManager.loadPlaceholderAssets();

                await nextStep(); // 步骤 2
                sceneManager = new SceneManager();
                sceneManager.setRenderSize(canvas.width, canvas.height);

                await nextStep(); // 步骤 3
                notificationSystem = new NotificationSystem({ x: 10, y: 100, maxNotifications: 5 });
                scene = null;

                await nextStep(); // 步骤 4

                await nextStep(); // 步骤 5
                // 全部走数据驱动：DataDrivenPrologueScene 管理整个大地图
                // ?ddscene=preview 仅用于编辑器单场景预览
                const _ddSceneId = new URLSearchParams(location.search).get('ddscene');
                if (_ddSceneId === 'preview') {
                    const dd = new DataDrivenScene('DataDrivenScene', { sceneManager });
                    try {
                        await dd.loadProjectUrl('game.project.json');
                        await dd.loadEditorScene('sanguo_zhangjiao', 'scene_Prologue', 'assets/scenes/');
                    } catch (e) {
                        console.warn('DataDrivenScene 预览加载失败', e);
                    }
                    sceneManager.registerScene('DataDrivenScene', dd);
                    scene = dd;
                    sceneManager.switchTo('DataDrivenScene');
                } else {
                    const dd = new DataDrivenPrologueScene();
                    dd.assetManager = assetManager;
                    sceneManager.registerScene('DataDrivenPrologueScene', dd);
                    dd.setSceneManager(sceneManager);
                    scene = dd;
                    sceneManager.switchTo('DataDrivenPrologueScene');
                }
                
                if (scene) {
                    setupSceneCallbacks(scene);
                    scene.setSystemMenuCallback?.(() => openSystemMenu());
                    scene.setAutoSaveCallback?.(context => autoSaveCurrentGame({ reason: context?.reason || 'scene-event' }));

                    // 读档必须等世界、放置点和 GameLoader 都完成，避免恢复状态被异步初始化覆盖。
                    const readyTasks = [scene._worldLoadPromise, scene._gameLoaderReady].filter(Boolean);
                    if (readyTasks.length) await Promise.allSettled(readyTasks);
                    saveGames.setStateProvider({
                        capture: () => scene.captureSaveState(),
                        validate: data => scene.validateSaveState(data),
                        restore: data => scene.restoreSaveState(data)
                    });
                    const selection = options.saveSelection || { kind: 'manual', index: activeSaveSlot };
                    if (selection.kind === 'manual') activeSaveSlot = selection.index;
                    if (options.loadSave) {
                        const loaded = selection.kind === 'auto'
                            ? saveGames.loadAuto(selection.index)
                            : saveGames.load(selection.index);
                        if (!loaded.ok) {
                            console.warn('读取存档失败', loaded.errors);
                            throw new Error('存档读取失败，存档数据可能已损坏。');
                        }
                    } else {
                        // 新游戏只清理所选手动栏位，绝不影响自动存档位。
                        saveGames.clear(activeSaveSlot);
                    }
                }
                
                await nextStep(); // 步骤 6（完成）
                gameStarted = true;
                if (!options.loadSave) await saveCurrentGame({ silent: true });
                clearInterval(autosaveTimer);
                autosaveTimer = setInterval(() => { void autoSaveCurrentGame({ reason: 'interval' }); }, AUTO_SAVE_INTERVAL_MS);
                
                // 隐藏加载屏幕
                loadingScreen.style.display = 'none';
                
                console.log('准备启动游戏循环...');
                
                // 开始游戏循环
                requestAnimationFrame(gameLoop);
                
                console.log('游戏初始化完成，游戏循环已启动');
            } catch (error) {
                console.error('游戏初始化失败:', error);
                loadingText.textContent = '加载失败: ' + error.message;
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                    loginScreen.classList.remove('hidden');
                    setLoginMessage(error.message || '游戏加载失败，请重试。');
                }, 800);
            }
        }

        // 更新技能按钮冷却状态（技能3/4/5 = data-skill 0/1/2）
        function updateSkillButtonCooldowns() {
            const cs = sceneManager ? sceneManager.getCurrentScene() : scene;
            if (!cs || !cs.playerEntity) return;
            const combat = cs.playerEntity.getComponent('combat');
            const stats = cs.playerEntity.getComponent('stats');
            if (!combat || !combat.skills) return;
            
            const currentTime = performance.now();
            const skillBtns = document.querySelectorAll('.action-btn.skill[data-skill]');
            skillBtns.forEach(btn => {
                const idx = parseInt(btn.dataset.skill, 10);
                const skill = combat.skills[idx];
                if (!skill) return;
                
                const cdRemainingMs = combat.getSkillCooldownRemaining(skill.id, currentTime);
                const cdRemaining = cdRemainingMs / 1000; // 转为秒
                const overlay = btn.querySelector('.skill-cd-overlay');
                const cdText = btn.querySelector('.skill-cd-text');
                
                // 蓝量不足：按钮灰色
                const noMana = stats && skill.manaCost && stats.mp < skill.manaCost;
                if (noMana && cdRemaining <= 0) {
                    btn.style.filter = 'grayscale(1) opacity(0.5)';
                } else if (cdRemaining <= 0) {
                    btn.style.filter = '';
                }
                
                if (cdRemaining > 0) {
                    btn.classList.add('on-cd');
                    btn.style.filter = 'grayscale(0.7) opacity(0.6)';
                    // 计算冷却进度（剩余比例），用 conic-gradient 做扇形遮罩
                    const total = skill.cooldown || 1;
                    const ratio = Math.min(1, cdRemaining / total); // 1=刚开始冷却, 0=冷却结束
                    if (overlay) {
                        overlay.style.display = 'block';
                        overlay.style.background = `conic-gradient(from 0deg, rgba(0,0,0,0.75) ${ratio * 360}deg, transparent ${ratio * 360}deg)`;
                    }
                    if (cdText) {
                        cdText.style.display = 'block';
                        cdText.textContent = cdRemaining >= 1 ? Math.ceil(cdRemaining) : cdRemaining.toFixed(1);
                    }
                } else {
                    btn.classList.remove('on-cd');
                    if (overlay) overlay.style.display = 'none';
                    if (cdText) cdText.style.display = 'none';
                }
            });
        }

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏编辑器 - YiJian18-Engine Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #0a0a1e;
            color: #fff;
            min-height: 100vh;
        }
        
        /* 编辑器主容器 */
        .editor-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* 顶部导航 */
        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #16213e;
            border-bottom: 1px solid #2a3a5e;
        }
        
        .editor-header h1 {
            font-size: 18px;
            color: #4CAF50;
        }
        
        .editor-header nav {
            display: flex;
            gap: 10px;
        }
        
        .editor-header nav button {
            padding: 8px 16px;
            background: #3a4a7e;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
        }
        
        .editor-header nav button:hover {
            background: #4a5a9e;
        }
        
        .editor-header nav button.active {
            background: #4CAF50;
            color: #000;
        }

        /* 游戏选择器指示器 */
        .editor-game-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .game-indicator-label {
            font-size: 13px;
            color: #aaa;
        }
        .game-selector {
            padding: 6px 12px;
            background: #2a3a5e;
            border: 1px solid #4CAF50;
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            min-width: 160px;
        }
        .game-selector:focus {
            outline: none;
            border-color: #66bb6a;
        }
        
        /* 主内容区 */
        .editor-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        /* 游戏列表页 */
        .game-list-page {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        
        .page-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #4CAF50;
        }
        
        .section-title {
            font-size: 18px;
            margin: 20px 0 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a3a5e;
        }
        
        /* 游戏卡片 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .game-card {
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.3);
        }
        
        .game-card-thumbnail {
            width: 100%;
            height: 160px;
            background: #2a3a5e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .game-card-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .game-card-thumbnail .placeholder {
            font-size: 48px;
            color: #4a5a8e;
        }
        
        .game-card-info {
            padding: 15px;
        }
        
        .game-card-info h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .game-card-info p {
            font-size: 13px;
            color: #aaa;
            line-height: 1.5;
        }
        
        .game-card-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        
        .game-card-actions button {
            flex: 1;
            padding: 8px;
            background: #3a4a7e;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
        }
        
        .game-card-actions button:hover {
            background: #4a5a9e;
        }
        
        .game-card-actions button.primary {
            background: #4CAF50;
            color: #000;
        }
        
        /* 新建游戏卡片 */
        .new-game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            background: #16213e;
            border: 2px dashed #3a4a7e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .new-game-card:hover {
            border-color: #4CAF50;
            background: #1a2a4e;
        }
        
        .new-game-card .icon {
            font-size: 48px;
            color: #4a5a8e;
            margin-bottom: 10px;
        }
        
        .new-game-card span {
            font-size: 14px;
            color: #aaa;
        }
        
        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: #16213e;
            border-radius: 8px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #4CAF50;
        }
        
        .modal-form .form-group {
            margin-bottom: 15px;
        }
        
        .modal-form label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #aaa;
        }
        
        .modal-form input,
        .modal-form textarea {
            width: 100%;
            padding: 10px;
            background: #2a3a5e;
            border: 1px solid #3a4a7e;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }
        
        .modal-form textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .modal-actions button.cancel {
            background: #3a4a7e;
            color: #fff;
        }
        
        .modal-actions button.confirm {
            background: #4CAF50;
            color: #000;
        }
        
        /* 场景编辑器页 */
        .scene-editor-page {
            flex: 1;
            display: none;
        }
        
        .scene-editor-page.active {
            display: flex;
        }
        
        #scene-editor-container {
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }
        
        /* UI 编辑器页 */
        .ui-editor-page {
            flex: 1;
            display: none;
        }
        .ui-editor-page.active {
            display: flex;
        }
        #ui-editor-container {
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }
        
        /* 场景列表侧边栏 */
        .scene-sidebar {
            width: 250px;
            background: #16213e;
            border-right: 1px solid #2a3a5e;
            display: flex;
            flex-direction: column;
        }
        
        .scene-sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #2a3a5e;
        }
        
        .scene-sidebar-header h3 {
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .scene-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .scene-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 5px;
            background: #2a3a5e;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .scene-item:hover {
            background: #3a4a7e;
        }
        
        .scene-item.active {
            background: #4CAF50;
            color: #000;
        }
        
        .scene-item .scene-name {
            flex: 1;
        }
        
        .scene-item .scene-actions {
            display: flex;
            gap: 5px;
        }
        
        .scene-item .scene-actions button {
            padding: 3px 8px;
            background: rgba(0,0,0,0.2);
            border: none;
            border-radius: 3px;
            color: inherit;
            cursor: pointer;
            font-size: 11px;
        }

        .scene-drag-handle {
            cursor: grab;
            margin-right: 8px;
            color: #666;
            font-size: 14px;
            user-select: none;
        }

        .scene-item.drag-over {
            border-top: 2px solid #4CAF50;
        }
        
        .scene-sidebar-footer {
            padding: 10px;
            border-top: 1px solid #2a3a5e;
        }
        
        .scene-sidebar-footer button {
            width: 100%;
            padding: 10px;
            background: #3a4a7e;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
        }
        
        /* 图片分割工具模态框 */
        .slicer-modal {
            max-width: 1200px;
            width: 95%;
            height: 85vh;
        }
        
        .slicer-modal .modal-content {
            height: 100%;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
            
            .editor-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .scene-sidebar {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="editor-app">
        <!-- 顶部导航 -->
        <header class="editor-header">
            <h1>🎮 游戏编辑器</h1>
            <div class="editor-game-indicator" id="editor-game-indicator" style="display:none;">
                <span class="game-indicator-label">当前游戏：</span>
                <select id="game-selector" class="game-selector"></select>
            </div>
            <nav>
                <button id="nav-game-list" class="active">游戏列表</button>
                <button id="nav-scene-editor">场景编辑器</button>
                <button id="nav-ui-editor">UI编辑器</button>
                <button id="nav-trigger-editor">事件编辑器</button>
                <button id="nav-dialogue-editor">对话编辑器</button>
                <button id="nav-library-editor">内容库</button>
                <button id="nav-world-map-editor">大地图块编辑器</button>
                <button id="nav-panel-editor">面板编辑器</button>
                <button id="nav-system-editor">系统编辑器</button>
                <button id="nav-home">返回首页</button>
            </nav>
        </header>
        
        <!-- 主内容区 -->
        <main class="editor-content">
            <!-- 游戏列表页 -->
            <div class="game-list-page" id="game-list-page">
                <h2 class="page-title">游戏项目管理</h2>
                
                <h3 class="section-title">内置示例游戏</h3>
                <div class="game-grid" id="builtin-games-grid"></div>
                
                <h3 class="section-title">我的游戏</h3>
                <div class="game-grid" id="custom-games-grid">
                    <!-- 新建游戏卡片 -->
                    <div class="new-game-card" id="new-game-btn">
                        <div class="icon">+</div>
                        <span>创建新游戏</span>
                    </div>
                </div>
            </div>
            
            <!-- 场景编辑器页 -->
            <div class="scene-editor-page" id="scene-editor-page">
                <div class="scene-sidebar">
                    <div class="scene-sidebar-header">
                        <h3>场景列表</h3>
                        <div id="current-game-name">未选择游戏</div>
                    </div>
                    <div style="padding:4px 8px;border-bottom:1px solid #333;display:flex;gap:4px;align-items:center;">
                        <select id="scene-filter-type" style="flex:1;padding:2px 4px;font-size:12px;background:#2a2a2a;color:#ccc;border:1px solid #444;border-radius:3px;">
                            <option value="all">所有场景</option>
                            <option value="worldChunk">大地图块</option>
                            <option value="standalone">独立场景</option>
                            <option value="template">场景模板</option>
                        </select>
                        <select id="scene-filter-worldmap" style="flex:1;padding:2px 4px;font-size:12px;background:#2a2a2a;color:#ccc;border:1px solid #444;border-radius:3px;display:none;">
                        </select>
                    </div>
                    <div class="scene-list" id="scene-list"></div>
                    <div class="scene-sidebar-footer">
                        <button id="new-scene-btn">+ 新建场景</button>
                        <button id="new-template-btn" title="新建场景模板">+ 新建场景模板</button>
                    </div>
                </div>
                <div id="scene-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>
            
            <!-- UI 编辑器页 -->
            <div class="ui-editor-page" id="ui-editor-page">
                <div id="ui-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>

            <!-- 事件编辑器页 -->
            <div class="ui-editor-page" id="trigger-editor-page">
                <div id="trigger-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>

            <!-- 内容库编辑器页 -->
            <div class="ui-editor-page" id="library-editor-page">
                <div id="library-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>

            <!-- 对话编辑器页 -->
            <div class="ui-editor-page" id="dialogue-editor-page">
                <div id="dialogue-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>

            <!-- 大地图块编辑器页 -->
            <div class="ui-editor-page" id="world-map-editor-page" style="overflow:auto;min-width:0;">
                <div id="world-map-editor-container" style="min-height:0;padding:16px;"></div>
            </div>

            <!-- 面板编辑器页 -->
            <div class="ui-editor-page" id="panel-editor-page">
                <div id="panel-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>

            <!-- 系统编辑器页 -->
            <div class="ui-editor-page" id="system-editor-page">
                <div id="system-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>
        </main>
    </div>
    
    <!-- 新建游戏模态框 -->
    <div class="modal-overlay" id="new-game-modal">
        <div class="modal">
            <h2>创建新游戏</h2>
            <form class="modal-form" id="new-game-form">
                <div class="form-group">
                    <label>游戏名称 *</label>
                    <input type="text" id="game-name" required placeholder="输入游戏名称">
                </div>
                <div class="form-group">
                    <label>游戏描述</label>
                    <textarea id="game-description" placeholder="简要描述你的游戏"></textarea>
                </div>
                <div class="form-group">
                    <label>缩略图</label>
                    <input type="file" id="game-thumbnail" accept="image/*">
                </div>
            </form>
            <div class="modal-actions">
                <button class="cancel" id="cancel-new-game">取消</button>
                <button class="confirm" id="confirm-new-game">创建</button>
            </div>
        </div>
    </div>
    
    <!-- 新建场景模态框 -->
    <div class="modal-overlay" id="new-scene-modal">
        <div class="modal">
            <h2>创建新场景</h2>
            <form class="modal-form" id="new-scene-form">
                <div class="form-group">
                    <label>场景名称 *</label>
                    <input type="text" id="scene-name" required placeholder="输入场景名称">
                </div>
                <div class="form-group">
                    <label>场景模板</label>
                    <select id="scene-template"></select>
                    <div id="scene-template-desc" style="margin-top:4px;font-size:12px;color:#888;"></div>
                </div>
                <div class="form-group">
                    <label>场景宽度</label>
                    <input type="number" id="scene-width" value="1280" min="100">
                </div>
                <div class="form-group">
                    <label>场景高度</label>
                    <input type="number" id="scene-height" value="720" min="100">
                </div>
                <div class="form-group">
                    <label>背景颜色</label>
                    <input type="color" id="scene-bg-color" value="#2a3a1a">
                </div>
            </form>
            <div class="modal-actions">
                <button class="cancel" id="cancel-new-scene">取消</button>
                <button class="confirm" id="confirm-new-scene">创建</button>
            </div>
        </div>
    </div>


    
    <!-- 图片分割工具模态框 -->
    <div class="modal-overlay" id="slicer-modal">
        <div class="modal slicer-modal">
            <div class="modal-content" id="slicer-container"></div>
        </div>
    </div>

    <script type="module">
        import { GameEditor } from './EditorInteraction.js';
        new GameEditor();
    </script>
</body>
</html>

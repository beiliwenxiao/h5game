<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>张角黄巾起义序章 - 第一幕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            overflow: hidden;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        #gameCanvas {
            border: 2px solid #4CAF50;
            background-color: #2a2a2a;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100%;
            height: 100%;
        }
        
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #tutorial-panel {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 40px;
            border-radius: 15px;
            border: 3px solid #2196F3;
            pointer-events: auto;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 20px rgba(33, 150, 243, 0.5);
            animation: fadeIn 0.3s ease-in;
        }
        
        #tips-panel {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 16px;
            border-radius: 10px;
            border: 2px solid #4CAF50;
            pointer-events: none;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
            animation: fadeIn 0.3s ease-in;
        }
        
        /* 隐藏提示标题（“提示”字样） */
        #tips-title {
            display: none;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        #tutorial-panel h3 {
            color: #2196F3;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        #tips-panel h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 16px;
        }
        
        #tutorial-panel p {
            font-size: 14px;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 20px;
        }
        
        #tips-panel p {
            font-size: 14px;
            line-height: 1.3;
            color: #ffffff;
            margin: 0;
        }
        
        #tutorial-panel .key {
            display: inline-block;
            background: #2196F3;
            color: #000;
            padding: 3px 9px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            margin: 0 3px;
        }
        
        #tips-panel .key {
            display: inline-block;
            background: #4CAF50;
            color: #000;
            padding: 3px 9px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            margin: 0 3px;
        }
        
        #tutorial-panel .tutorial-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }
        
        #tutorial-panel button {
            padding: 10px 20px;
            background: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        #tutorial-panel button:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        #tutorial-panel button:active {
            transform: translateY(0);
        }
        
        #tutorial-panel button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        #tutorial-panel .step-indicator {
            font-size: 14px;
            color: #aaa;
            margin-top: 10px;
        }
        
        #debug-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            pointer-events: none;
            display: none; /* 隐藏 FPS 调试框 */
        }
        
        #debug-panel div {
            margin: 2px 0;
        }
        
        #controls-hint {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .hidden {
            display: none !important;
        }
        
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 1000;
        }
        
        #loading-screen h1 {
            color: #4CAF50;
            margin-bottom: 20px;
        }
        
        .progress-bar {
            width: 300px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s;
        }
        
        /* 技能栏样式 */
        #skill-bar {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        
        .skill-slot {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #4CAF50;
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .skill-slot:hover {
            border-color: #8BC34A;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.5);
        }
        
        .skill-slot.on-cooldown {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .skill-slot.on-cooldown:hover {
            transform: none;
            box-shadow: none;
        }
        
        .skill-icon {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .skill-hotkey {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            color: #4CAF50;
            font-weight: bold;
        }
        
        .skill-cooldown {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            border-radius: 6px;
        }
        
        .skill-name {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #aaa;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        .skill-slot:hover .skill-name {
            opacity: 1;
        }
        
        .skill-mana-cost {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            color: #2196F3;
            font-weight: bold;
        }
        
        /* ============ 屏幕触控按钮（移动端 / 触屏） ============ */
        #touch-controls {
            position: absolute;
            inset: 0;
            pointer-events: none; /* 容器不拦截，子按钮各自开启 */
            z-index: 500;
            display: none; /* 默认隐藏，触屏设备显示 */
        }
        
        #touch-controls.active {
            display: block;
        }
        
        /* 左下角虚拟摇杆区域（透明圆形热区） */
        #joystick-zone {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 30%;
            max-width: 280px;
            height: 55%;
            pointer-events: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            z-index: 0;
        }
        
        #joystick-canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }
        
        /* 摇杆绘制层：覆盖整个游戏容器（与主 canvas 同尺寸），避免旋转坐标换算 */
        #joystick-overlay {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 600;
        }
        
        /* ===== 右侧动作按钮组：外圈3技能 + 中心攻击 + 轻功 + 投掷 ===== */
        #action-buttons {
            position: absolute;
            right: -16px;
            bottom: 12px;
            width: 220px;
            height: 220px;
            pointer-events: none;
        }
        
        .action-btn {
            position: absolute;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: #fff;
            font-size: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: background 0.1s;
        }
        
        .action-btn .label {
            font-size: 10px;
            margin-top: 2px;
            color: #ddd;
        }
        
        .action-btn.pressed {
            background: rgba(33, 150, 243, 0.7);
            border-color: #64b5f6;
        }
        
        /* 中心：攻击（最大） */
        .action-btn.attack {
            width: 78px;
            height: 78px;
            font-size: 26px;
            background: rgba(200, 60, 40, 0.6);
            border-color: rgba(255, 120, 90, 0.85);
        }
        .action-btn.attack.pressed { background: rgba(200, 60, 40, 0.9); }
        /* 交互模式（非战斗）：绿色手掌 */
        .action-btn.attack.interact-mode {
            background: rgba(76, 175, 80, 0.6);
            border-color: rgba(139, 195, 74, 0.85);
        }
        .action-btn.attack.interact-mode.pressed { background: rgba(76, 175, 80, 0.9); }
        
        /* 攻击放在按钮组中心 */
        #act-attack  { right: 66px; bottom: 70px; }
        /* 外侧3个技能：水平翻转后的位置 */
        #act-skill3  { right: 154px; bottom: 84px; }
        #act-skill4  { right: 114px; bottom: 150px; }
        #act-skill5  { right: 38px;  bottom: 156px; }
        
        /* 技能按钮冷却遮罩（扇形逐渐消退，模仿 PC 技能栏） */
        .action-btn.skill {
            overflow: hidden;
        }
        .skill-cd-overlay {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            pointer-events: none;
            display: none;
            z-index: 2;
        }
        .action-btn.skill.on-cd .skill-cd-overlay {
            display: block;
        }
        .action-btn.skill.on-cd {
            opacity: 0.65;
            border-color: rgba(255, 255, 255, 0.2);
        }
        .skill-cd-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 4px #000, 0 0 4px #000;
            pointer-events: none;
            display: none;
            z-index: 3;
        }
        .action-btn.skill.on-cd .skill-cd-text {
            display: block;
        }
        
        /* 中心左下：轻功 */
        .action-btn.move {
            width: 56px;
            height: 56px;
            font-size: 18px;
            background: rgba(60, 120, 200, 0.55);
            border-color: rgba(120, 170, 240, 0.8);
        }
        .action-btn.move.pressed { background: rgba(60, 120, 200, 0.9); }
        /* 轻功与投掷底部对齐 */
        #act-flight { right: 150px; bottom: 0px; }
        /* 中心右侧：投掷（向左移动 20px → right 增大 20） */
        #act-throw  { right: 20px;   bottom: 0px; }
        
        /* ===== 底部快捷栏：背包 / 装备 / 技能6 / 技能7（无边框，按钮+文字） ===== */
        #bottom-hotbar {
            position: absolute;
            left: 50%;
            bottom: 8px;
            transform: translateX(-50%);
            display: flex;
            gap: 28px;
            pointer-events: none;
            z-index: 10;
        }
        .hotbar-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            pointer-events: auto;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            /* 无边框、无背景 */
        }
        .hotbar-btn .hb-icon {
            font-size: 30px;
            line-height: 1;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }
        .hotbar-btn .hb-label {
            font-size: 12px;
            margin-top: 3px;
            color: #eee;
            text-shadow: 0 1px 2px rgba(0,0,0,0.9);
        }
        .hotbar-btn.pressed { opacity: 0.6; }
        
        /* 药瓶按钮：PC 风格图标 + 右下角剩余数量 */
        .hotbar-btn.potion-btn {
            position: relative;
        }
        .hotbar-btn .hb-canvas {
            width: 44px;
            height: 44px;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
            pointer-events: none;
        }
        .hotbar-btn .hb-count {
            position: absolute;
            right: -2px;
            bottom: -2px;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 3px #000, 0 0 3px #000;
            pointer-events: none;
        }
        
        /* ============ 竖屏时强制以横屏方式显示页面（不锁定方向，仅 CSS 旋转） ============ */
        #game-container {
            transform-origin: center center;
        }
        
        /* 触屏 + 竖屏：把容器旋转 90°，并将宽高对调以填满屏幕 */
        body.force-landscape #game-container {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            transform: translate(-50%, -50%) rotate(90deg);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-overlay">
            <div id="tutorial-panel" class="hidden">
                <h3 id="tutorial-title">教程</h3>
                <p id="tutorial-text">教程内容</p>
                <div class="tutorial-buttons">
                    <button id="tutorial-prev-btn" style="display: none;">上一步</button>
                    <button id="tutorial-next-btn">下一步</button>
                </div>
                <div class="step-indicator" id="tutorial-step-indicator"></div>
            </div>
            
            <div id="tips-panel" class="hidden">
                <h3 id="tips-title">提示</h3>
                <p id="tips-text">提示内容</p>
            </div>
            
            <div id="debug-panel">
                <div>FPS: <span id="fps">60</span></div>
                <div>位置: <span id="position">0, 0</span></div>
                <div>生命值: <span id="hp">100/100</span></div>
                <div>阶段: <span id="phase">-</span></div>
                <div>敌人: <span id="enemies">0</span></div>
            </div>
            
            <!-- <div id="controls-hint">
                WASD/方向键: 移动 | 鼠标点击: 移动 | E: 拾取 | C: 属性/装备 | B: 背包 | 1-3: 技能
            </div> -->
            
            <div id="skill-bar" style="display: none;">
                <div class="skill-slot" data-skill-index="0">
                    <div class="skill-icon">⚔️</div>
                    <div class="skill-hotkey">1</div>
                    <div class="skill-mana-cost">0</div>
                    <div class="skill-name">普通攻击</div>
                </div>
                <div class="skill-slot" data-skill-index="1">
                    <div class="skill-icon">💥</div>
                    <div class="skill-hotkey">2</div>
                    <div class="skill-mana-cost">10</div>
                    <div class="skill-name">重击</div>
                </div>
                <div class="skill-slot" data-skill-index="2">
                    <div class="skill-icon">🔥</div>
                    <div class="skill-hotkey">3</div>
                    <div class="skill-mana-cost">15</div>
                    <div class="skill-name">火球术</div>
                </div>
                <div class="skill-slot" data-skill-index="3">
                    <div class="skill-icon">💚</div>
                    <div class="skill-hotkey">4</div>
                    <div class="skill-mana-cost">20</div>
                    <div class="skill-name">治疗术</div>
                </div>
            </div>
        </div>
        
        <!-- 屏幕触控按钮：左侧摇杆 + 右侧功能键 + 底部快捷栏 -->
        <div id="touch-controls">
            <canvas id="joystick-overlay"></canvas>
            <div id="joystick-zone"></div>

            <!-- 右侧动作按钮组：外圈3技能 + 中心攻击 + 轻功 + 投掷 -->
            <div id="action-buttons">
                <!-- 外侧3个：技能3/4/5（火焰掌/寒冰指/烈焰掌 = index 0/1/2） -->
                <div class="action-btn skill" id="act-skill3" data-skill="0">🔥<span class="label">火焰掌</span><div class="skill-cd-overlay"></div><span class="skill-cd-text"></span></div>
                <div class="action-btn skill" id="act-skill4" data-skill="1">❄<span class="label">寒冰指</span><div class="skill-cd-overlay"></div><span class="skill-cd-text"></span></div>
                <div class="action-btn skill" id="act-skill5" data-skill="2">💥<span class="label">烈焰掌</span><div class="skill-cd-overlay"></div><span class="skill-cd-text"></span></div>
                <!-- 中心：交互/攻击（平时交互，战斗中变攻击） -->
                <div class="action-btn attack" id="act-attack" data-act="attack"><span class="atk-icon">✋</span><span class="label atk-label">交互</span></div>
                <!-- 中心左下：轻功 -->
                <div class="action-btn move" id="act-flight" data-act="flight">🌀<span class="label">轻功</span></div>
                <!-- 中心右侧：投掷 -->
                <div class="action-btn move" id="act-throw" data-act="throw">🎯<span class="label">投掷</span></div>
            </div>

            <!-- 底部快捷栏：红瓶 / 蓝瓶 / 装备 / 背包 / 技能6 / 技能7（无边框，按钮+文字） -->
            <div id="bottom-hotbar">
                <div class="hotbar-btn potion-btn" id="hb-hp" data-potion="health"><canvas class="hb-canvas" width="32" height="32"></canvas><span class="hb-count">0</span></div>
                <div class="hotbar-btn potion-btn" id="hb-mp" data-potion="mana"><canvas class="hb-canvas" width="32" height="32"></canvas><span class="hb-count">0</span></div>
                <div class="hotbar-btn" id="hb-char" data-action="char"><span class="hb-icon">👤</span><span class="hb-label">装备</span></div>
                <div class="hotbar-btn" id="hb-bag" data-action="bag"><span class="hb-icon">🎒</span><span class="hb-label">背包</span></div>
                <div class="hotbar-btn" id="hb-skill6" data-skill="3"><span class="hb-icon">💓</span><span class="hb-label">回血</span></div>
                <div class="hotbar-btn" id="hb-skill7" data-skill="4"><span class="hb-icon">🛀</span><span class="hb-label">打坐</span></div>
            </div>
        </div>
        
        <div id="loading-screen">
            <h1>张角黄巾起义序章</h1>
            <h2>第一幕：绝望的开始</h2>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p id="loading-text">加载中...</p>
        </div>
    </div>
    
    <script type="module">
        import { Act1SceneECS } from './scenes/Act1SceneECS.js';
        import { Act2Scene } from './scenes/Act2Scene.js';
        import { Act3Scene } from './scenes/Act3Scene.js';
        import { Act4Scene } from './scenes/Act4Scene.js';
        import { Act5Scene } from './scenes/Act5Scene.js';
        import { Act6Scene } from './scenes/Act6Scene.js';
        import { SceneManager } from '../../src/core/SceneManager.js';
        import { AssetManager } from '../../src/core/AssetManager.js';
        import { DialogueBox } from '../../src/ui/DialogueBox.js';
        import { SkillTreePanel } from '../../src/ui/SkillTreePanel.js';
        import { NotificationSystem } from '../../src/ui/NotificationSystem.js';
        import { InventoryPanel } from '../../src/ui/InventoryPanel.js';
        import { AttributePanel } from '../../src/ui/AttributePanel.js';
        import { PlayerInfoPanel } from '../../src/ui/PlayerInfoPanel.js';
        import { ItemIconRenderer } from '../../src/ui/ItemIconRenderer.js';
        import { PortraitsConfig } from './data/PortraitsConfig.js';
        
        // 场景管理器
        let sceneManager = null;
        let assetManager = null;
        
        // UI组件
        let dialogueBox = null;
        let skillTreePanel = null;
        let notificationSystem = null;
        let inventoryPanel = null;
        let attributePanel = null;
        let playerInfoPanel = null;
        
        // 游戏状态
        let scene = null;
        let lastTime = performance.now();
        let fps = 60;
        let frameCount = 0;
        let fpsTime = 0;
        
        // 获取元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Canvas 自适应容器大小
        function resizeCanvas() {
            const rotate = document.body.classList.contains('force-landscape');
            let cw, ch;
            if (rotate) {
                // 旋转模式：容器 CSS 宽=100vh，高=100vw，即逻辑宽为屏幕高，逻辑高为屏幕宽
                cw = window.innerHeight;
                ch = window.innerWidth;
            } else {
                const container = canvas.parentElement;
                cw = container ? container.clientWidth : window.innerWidth;
                ch = container ? container.clientHeight : window.innerHeight;
            }
            canvas.width = cw;
            canvas.height = ch;
            
            // 通知当前场景更新尺寸
            if (sceneManager) {
                sceneManager.setRenderSize(cw, ch);
                const currentScene = sceneManager.getCurrentScene();
                if (currentScene && currentScene.onResize) {
                    currentScene.onResize(cw, ch);
                }
            }
        }
        // 首次加载时检测是否需要竖屏旋转，确保第一帧尺寸正确
        (function initForceLandscape() {
            const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            const portrait = window.innerHeight > window.innerWidth;
            if (isTouch && portrait) {
                document.body.classList.add('force-landscape');
            }
        })();
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        const loadingScreen = document.getElementById('loading-screen');
        const progressFill = document.getElementById('progress-fill');
        const loadingText = document.getElementById('loading-text');
        const tutorialPanel = document.getElementById('tutorial-panel');

        const tutorialText = document.getElementById('tutorial-text');
        const tutorialNextBtn = document.getElementById('tutorial-next-btn');
        const tutorialPrevBtn = document.getElementById('tutorial-prev-btn');
        const tutorialStepIndicator = document.getElementById('tutorial-step-indicator');
        
        const tipsPanel = document.getElementById('tips-panel');
        const tipsTitle = document.getElementById('tips-title');
        const tipsText = document.getElementById('tips-text');
        
        // 当前教程数据
        let currentTutorialData = null;
        
        // 调试面板元素
        const fpsElement = document.getElementById('fps');
        const positionElement = document.getElementById('position');
        const hpElement = document.getElementById('hp');
        const phaseElement = document.getElementById('phase');
        const enemiesElement = document.getElementById('enemies');
        
        // 教程按钮事件
        tutorialNextBtn.addEventListener('click', () => {
            if (scene && scene.tutorialSystem) {
                const hasNext = scene.tutorialSystem.nextStep();
                if (!hasNext) {
                    // 没有下一步了，隐藏教程
                    hideTutorial();
                }
            }
        });

            if (scene && scene.tutorialSystem) {
                scene.tutorialSystem.previousStep();
            }
        });
        
        // 为场景设置回调
        function setupSceneCallbacks(sceneInstance) {
            if (!sceneInstance || !sceneInstance.tutorialSystem) {
                console.warn('setupSceneCallbacks: 场景或教程系统不存在');
                return;
            }
            
            console.log('setupSceneCallbacks: 为场景设置回调');
            
            // 设置教程回调
            sceneInstance.tutorialSystem.onShow((data) => {
                console.log('index.html: onShow 回调被触发');
                currentTutorialData = data;
                
                // 判断是渐进式提示还是基础教程
                const isProgressiveTip = data.tutorialId && data.tutorialId.startsWith('progressive_tip_');
                
                // 处理两种回调格式：
                // 1. showTutorial 调用时传入 tutorial 对象
                // 2. showStep 调用时传入 stepData 对象
                if (data.step && data.step.text) {
                    // stepData 格式（多步教程）
                    if (isProgressiveTip) {
                        // 渐进式提示：使用提示面板（无按钮）
                        showTips(data.tutorialTitle, data.step.text);
                    } else {
                        // 基础教程：使用教程面板（有按钮）
                        showTutorial(
                            data.tutorialTitle, 
                            data.step.text,
                            data.stepIndex,
                            data.totalSteps,
                            data.isLastStep
                        );
                    }
                } else if (data.title) {
                    // tutorial 对象格式（首次显示）
                    if (isProgressiveTip) {
                        // 渐进式提示：使用提示面板（无按钮）
                        showTips(data.title, data.steps[0]?.text || '');
                    } else {
                        // 基础教程：使用教程面板（有按钮）
                        showTutorial(
                            data.title, 
                            data.steps[0]?.text || '',
                            0,
                            data.steps.length,
                            data.steps.length === 1
                        );
                    }
                }
            });
            
            sceneInstance.tutorialSystem.onHide(() => {
                hideTutorial();
                hideTips();
            });
            
            // 设置对话系统回调（如果有）
            if (sceneInstance.dialogueSystem) {
                // 创建或更新 DialogueBox
                if (!dialogueBox) {
                    dialogueBox = new DialogueBox({
                        x: 100,
                        y: 370,
                        width: 600,
                        height: 200,
                        visible: false,
                        dialogueSystem: sceneInstance.dialogueSystem,
                        portraits: PortraitsConfig
                    });
                } else {
                    dialogueBox.setDialogueSystem(sceneInstance.dialogueSystem);
                }
                
                // 当对话开始时显示对话框
                sceneInstance.dialogueSystem.onStart(() => {
                    dialogueBox.show();
                });
                
                // 当对话结束时隐藏对话框
                sceneInstance.dialogueSystem.onEnd(() => {
                    dialogueBox.hide();
                });
                
                // 如果对话已经在进行中，立即显示对话框
                if (sceneInstance.dialogueSystem.isDialogueActive()) {
                    dialogueBox.show();
                }
            }
            
            // 设置通知系统回调（用于第二幕）
            if (sceneInstance.setNotificationCallback) {
                sceneInstance.setNotificationCallback((message, type) => {
                    if (notificationSystem) {
                        notificationSystem.addNotification(message, type);
                    }
                });
            }
            
            // 设置场景提示回调（复用提示面板）
            if (sceneInstance.setHintCallbacks) {
                sceneInstance.setHintCallbacks(
                    (text, title) => showTips(title, text),
                    () => hideTips()
                );
            }
            
            // 设置玩家实体引用（用于背包系统）
            if (sceneInstance.setPlayerEntity && sceneInstance.playerEntity) {
                sceneInstance.setPlayerEntity(sceneInstance.playerEntity);
            }
        }

        // 更新加载进度
        function updateLoading(progress, text) {
            progressFill.style.width = progress + '%';
            loadingText.textContent = text;
        }
        
        // 延迟函数
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // 是否触屏设备
        const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        
        // 注意：平台文案已由配置层（ProgressiveTipsConfig / TutorialConfig 的
        // .desktop / .mobile 两套）直接提供，不再在显示时做按键->按钮的运行时替换。
        // 此函数保留为透传，仅作兼容入口；如需对非配置来源文本做兜底处理可在此扩展。
        function localizeHintKeys(html) {
            return html;
        }
        
        // 显示教程（基础教程，有按钮）
        function showTutorial(title, text, stepIndex = 0, totalSteps = 1, isLastStep = true) {
            tutorialTitle.textContent = title;
            // 使用innerHTML支持HTML标签（触屏时把按键替换为屏幕按钮名）
            tutorialText.innerHTML = localizeHintKeys(text);
            tutorialPanel.classList.remove('hidden');
            
            // 更新步骤指示器
            if (totalSteps > 1) {
                tutorialStepIndicator.textContent = `步骤 ${stepIndex + 1} / ${totalSteps}`;
                tutorialStepIndicator.style.display = 'block';
            } else {
                tutorialStepIndicator.style.display = 'none';
            }
            
            // 更新按钮状态
            // 上一步按钮：只在不是第一步时显示
            if (stepIndex > 0) {
                tutorialPrevBtn.style.display = 'inline-block';
            } else {
                tutorialPrevBtn.style.display = 'none';
            }
            
            // 下一步按钮：最后一步显示"完成"，其他显示"下一步"
            if (isLastStep) {
                tutorialNextBtn.textContent = '完成';
            } else {
                tutorialNextBtn.textContent = '下一步';
            }
        }
        
        // 隐藏教程
        function hideTutorial() {
            tutorialPanel.classList.add('hidden');
            currentTutorialData = null;
        }
        
        // 显示提示（渐进式提示，无按钮）
        function showTips(title, text) {
            tipsTitle.textContent = title;
            // 使用innerHTML支持HTML标签（触屏时把按键替换为屏幕按钮名）
            tipsText.innerHTML = localizeHintKeys(text);
            tipsPanel.classList.remove('hidden');
        }
        
        // 隐藏提示
        function hideTips() {
            tipsPanel.classList.add('hidden');
        }
        
        // 目标帧率限制
        const TARGET_FPS = 60;
        const FRAME_INTERVAL = 1000 / TARGET_FPS;
        let lastFrameTime = 0;
        
        // 根据战斗状态切换攻击按钮：平时显示"交互/手掌"，战斗中显示"攻击/⚔️"
        let _lastAttackMode = null;
        function updateAttackButtonMode() {
            const btn = document.getElementById('act-attack');
            if (!btn) return;
            const cs = sceneManager ? sceneManager.getCurrentScene() : scene;
            const inCombat = !!(cs && cs.combatSystem && cs.combatSystem.isInCombat && cs.combatSystem.isInCombat());
            if (inCombat === _lastAttackMode) return; // 状态未变，避免每帧改 DOM
            _lastAttackMode = inCombat;
            
            const iconEl = btn.querySelector('.atk-icon');
            const labelEl = btn.querySelector('.atk-label');
            if (inCombat) {
                if (iconEl) iconEl.textContent = '⚔️';
                if (labelEl) labelEl.textContent = '攻击';
                btn.classList.remove('interact-mode');
            } else {
                if (iconEl) iconEl.textContent = '✋';
                if (labelEl) labelEl.textContent = '交互';
                btn.classList.add('interact-mode');
            }
        }
        
        // 更新技能按钮冷却状态（技能3/4/5 = data-skill 0/1/2）
        function updateSkillButtonCooldowns() {
            const cs = sceneManager ? sceneManager.getCurrentScene() : scene;
            if (!cs || !cs.playerEntity) return;
            const combat = cs.playerEntity.getComponent('combat');
            const stats = cs.playerEntity.getComponent('stats');
            if (!combat || !combat.skills) return;
            
            const currentTime = performance.now();
            const skillBtns = document.querySelectorAll('.action-btn.skill[data-skill]');
            skillBtns.forEach(btn => {
                const idx = parseInt(btn.dataset.skill, 10);
                const skill = combat.skills[idx];
                if (!skill) return;
                
                const cdRemainingMs = combat.getSkillCooldownRemaining(skill.id, currentTime);
                const cdRemaining = cdRemainingMs / 1000; // 转为秒
                const overlay = btn.querySelector('.skill-cd-overlay');
                const cdText = btn.querySelector('.skill-cd-text');
                
                // 蓝量不足：按钮灰色
                const noMana = stats && skill.manaCost && stats.mp < skill.manaCost;
                if (noMana && cdRemaining <= 0) {
                    btn.style.filter = 'grayscale(1) opacity(0.5)';
                } else if (cdRemaining <= 0) {
                    btn.style.filter = '';
                }
                
                if (cdRemaining > 0) {
                    btn.classList.add('on-cd');
                    btn.style.filter = 'grayscale(0.7) opacity(0.6)';
                    // 计算冷却进度（剩余比例），用 conic-gradient 做扇形遮罩
                    const total = skill.cooldown || 1;
                    const ratio = Math.min(1, cdRemaining / total); // 1=刚开始冷却, 0=冷却结束
                    if (overlay) {
                        overlay.style.display = 'block';
                        overlay.style.background = `conic-gradient(from 0deg, rgba(0,0,0,0.75) ${ratio * 360}deg, transparent ${ratio * 360}deg)`;
                    }
                    if (cdText) {
                        cdText.style.display = 'block';
                        cdText.textContent = cdRemaining >= 1 ? Math.ceil(cdRemaining) : cdRemaining.toFixed(1);
                    }
                } else {
                    btn.classList.remove('on-cd');
                    if (overlay) overlay.style.display = 'none';
                    if (cdText) cdText.style.display = 'none';
                }
            });
        }
        
        // 更新红瓶/蓝瓶按钮：PC 风格图标 + 剩余数量
        const _potionIconState = { health: null, mana: null };
        function updatePotionButtons() {
            const cs = sceneManager ? sceneManager.getCurrentScene() : scene;
            const player = cs && cs.playerEntity;
            const inv = player && player.getComponent && player.getComponent('inventory');
            
            const defs = [
                { id: 'hb-hp', effect: 'heal', placeholderId: 'health_potion', key: 'health' },
                { id: 'hb-mp', effect: 'restore_mana', placeholderId: 'mana_potion', key: 'mana' }
            ];
            for (const def of defs) {
                const btn = document.getElementById(def.id);
                if (!btn) continue;
                const cvs = btn.querySelector('.hb-canvas');
                const countEl = btn.querySelector('.hb-count');
                if (!cvs) continue;
                
                // 统计背包中对应药水的总数与第一个物品
                let count = 0;
                let item = null;
                if (inv && inv.getAllItems) {
                    for (const { slot } of inv.getAllItems()) {
                        if (slot.item && slot.item.type === 'consumable' && slot.item.usable &&
                            slot.item.effect && slot.item.effect.type === def.effect) {
                            if (!item) item = slot.item;
                            count += slot.quantity;
                        }
                    }
                }
                
                // 数量文本
                if (countEl) countEl.textContent = `${count}`;
                
                // 图标：仅在 (物品身份 + 是否为空) 变化时重绘，避免每帧清画
                const signature = (item ? item.id : def.placeholderId) + '|' + (count > 0 ? '1' : '0');
                if (_potionIconState[def.key] !== signature) {
                    _potionIconState[def.key] = signature;
                    const ictx = cvs.getContext('2d');
                    ictx.clearRect(0, 0, cvs.width, cvs.height);
                    const drawItem = item || {
                        id: def.placeholderId, type: 'consumable', effect: { type: def.effect }
                    };
                    ictx.save();
                    if (count <= 0) ictx.globalAlpha = 0.35;
                    // 居中绘制，尺寸略小于画布
                    ItemIconRenderer.drawIcon(ictx, drawItem, cvs.width / 2, cvs.height / 2, cvs.width * 0.9);
                    ictx.restore();
                }
            }
        }
        
        // 游戏循环
        function gameLoop(currentTime) {
            // 帧率限制：跳过过快的帧
            const elapsed = currentTime - lastFrameTime;
            if (elapsed < FRAME_INTERVAL) {
                requestAnimationFrame(gameLoop);
                return;
            }
            lastFrameTime = currentTime - (elapsed % FRAME_INTERVAL);
            
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;
            
            // 计算 FPS
            frameCount++;
            fpsTime += deltaTime;
            if (fpsTime >= 1.0) {
                fps = frameCount;
                frameCount = 0;
                fpsTime = 0;
            }
            
            // 清空画布
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 更新和渲染场景
            if (sceneManager) {
                sceneManager.update(deltaTime);
                sceneManager.render(ctx);
                
                // 根据战斗状态切换攻击/交互按钮外观
                updateAttackButtonMode();
                // 更新技能按钮冷却状态
                updateSkillButtonCooldowns();
                // 更新红瓶/蓝瓶图标与数量
                updatePotionButtons();
                
                // 对话框由场景自己渲染，这里不需要重复渲染
                
                // 更新和渲染技能树面板
                if (skillTreePanel) {
                    skillTreePanel.render(ctx);
                }
                
                // 更新和渲染通知系统
                if (notificationSystem) {
                    notificationSystem.update(deltaTime * 1000); // 转换为毫秒
                    notificationSystem.render(ctx);
                }
                
                // 背包面板由场景自己渲染，这里不需要重复渲染
                // 只有当场景没有背包面板时才渲染全局的
                if (inventoryPanel && (!scene || !scene.inventoryPanel)) {
                    inventoryPanel.update(deltaTime);
                    inventoryPanel.render(ctx);
                }
                
                // 角色信息面板由场景自己渲染，这里不需要重复渲染
                // 只有当场景没有角色信息面板时才渲染全局的
                if (playerInfoPanel && (!scene || !scene.playerInfoPanel)) {
                    playerInfoPanel.update(deltaTime);
                    playerInfoPanel.render(ctx);
                }
                
                // 获取当前场景
                const currentScene = sceneManager.getCurrentScene();
                
                // 如果场景切换了，设置新场景的回调
                if (currentScene !== scene) {
                    console.log('场景切换检测到，设置新场景回调');
                    scene = currentScene;
                    if (scene) {
                        setupSceneCallbacks(scene);
                        
                        // 如果是第二幕场景，设置玩家实体和背包面板
                        if (scene.setPlayerEntity && scene.playerEntity) {
                            scene.setPlayerEntity(scene.playerEntity);
                        }
                        
                        // 更新背包面板的实体引用
                        if (inventoryPanel && scene.playerEntity) {
                            inventoryPanel.setEntity(scene.playerEntity);
                        }
                        
                        // 重置技能树面板和属性面板（因为不同场景可能有不同的系统实例）
                        if (skillTreePanel) {
                            skillTreePanel.hide();
                            skillTreePanel = null;
                        }
                        if (attributePanel) {
                            attributePanel.hide();
                            attributePanel = null;
                        }
                        // 重置全局角色信息面板（因为不同场景可能有不同的玩家实体）
                        if (playerInfoPanel) {
                            playerInfoPanel.hide();
                            playerInfoPanel = null;
                        }
                    }
                }
                
                // 更新调试信息
                if (scene) {
                    updateDebugInfo();
                }
            }
            
            requestAnimationFrame(gameLoop);
        }
        
        // 更新调试信息
        function updateDebugInfo() {
            if (!scene) return;
            
            fpsElement.textContent = fps;
            
            // 使用 playerEntity（两幕都有）
            if (scene.playerEntity) {
                const transform = scene.playerEntity.getComponent('transform');
                if (transform) {
                    positionElement.textContent = 
                        `${Math.floor(transform.position.x)}, ${Math.floor(transform.position.y)}`;
                } else {
                    positionElement.textContent = '-';
                }
                
                const stats = scene.playerEntity.getComponent('stats');
                if (stats) {

        // ============ 屏幕触控按钮接线 ============
        /**
         * 左下角虚拟摇杆
         * - 透明圆形热区，手指按下处作为摇杆中心
         * - 显示手指方向的 90° 扇形圆周，并在圆周上绘制方向小箭头
         * - 将方向换算为 上/下/左/右 组合键，派发键盘事件复用移动系统
         */
        function setupVirtualJoystick(pressKey, releaseKey, dirKey) {
            const zone = document.getElementById('joystick-zone');
            const cvs = document.getElementById('joystick-overlay');
            const gameCanvas = document.getElementById('gameCanvas');
            if (!zone || !cvs || !gameCanvas) return;
            const jctx = cvs.getContext('2d');
            
            const RADIUS = 70;          // 摇杆圆周半径（canvas 像素）
            const DEAD_ZONE = 18;       // 死区
            
            let active = false;
            let centerX = 0, centerY = 0;   // 摇杆中心（canvas 像素坐标）
            let curX = 0, curY = 0;
            let activeDirs = { up: false, down: false, left: false, right: false };
            
            function resize() {
                // 覆盖层与主 canvas 同像素尺寸，绘制坐标 = canvas 像素坐标
                cvs.width = gameCanvas.width;
                cvs.height = gameCanvas.height;
            }
            resize();
            window.addEventListener('resize', () => setTimeout(resize, 50));
            window.addEventListener('orientationchange', () => setTimeout(resize, 150));
            
            // 复用全局指针变换（已处理旋转/缩放），回退到简单 rect 映射
            function clientToCanvas(clientX, clientY) {
                if (typeof window.__pointerTransform === 'function') {
                    return window.__pointerTransform(clientX, clientY);
                }
                const rect = gameCanvas.getBoundingClientRect();
                const sx = gameCanvas.width / rect.width;
                const sy = gameCanvas.height / rect.height;
                return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
            }
            
            // 根据角度计算 8 向（换算为方向键组合）
            function updateDirection(dx, dy) {
                const dist = Math.sqrt(dx * dx + dy * dy);
                const next = { up: false, down: false, left: false, right: false };
                if (dist >= DEAD_ZONE) {
                    let ang = Math.atan2(dy, dx) * 180 / Math.PI; // y 向下为正
                    if (ang < 0) ang += 360;
                    if (ang >= 22.5 && ang < 67.5)      { next.down = true; next.right = true; }
                    else if (ang >= 67.5 && ang < 112.5)  { next.down = true; }
                    else if (ang >= 112.5 && ang < 157.5) { next.down = true; next.left = true; }
                    else if (ang >= 157.5 && ang < 202.5) { next.left = true; }
                    else if (ang >= 202.5 && ang < 247.5) { next.up = true; next.left = true; }
                    else if (ang >= 247.5 && ang < 292.5) { next.up = true; }
                    else if (ang >= 292.5 && ang < 337.5) { next.up = true; next.right = true; }
                    else                                   { next.right = true; }
                }
                for (const d of ['up', 'down', 'left', 'right']) {
                    if (next[d] && !activeDirs[d]) pressKey(dirKey[d]);
                    else if (!next[d] && activeDirs[d]) releaseKey(dirKey[d]);
                }
                activeDirs = next;
            }
            
            function releaseAll() {
                for (const d of ['up', 'down', 'left', 'right']) {
                    if (activeDirs[d]) releaseKey(dirKey[d]);
                }
                activeDirs = { up: false, down: false, left: false, right: false };
            }
            
            function render() {
                jctx.clearRect(0, 0, cvs.width, cvs.height);
                if (!active) return;
                
                const dx = curX - centerX;
                const dy = curY - centerY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                // 基础圆（淡）
                jctx.beginPath();
                jctx.arc(centerX, centerY, RADIUS, 0, Math.PI * 2);
                jctx.strokeStyle = 'rgba(255,255,255,0.25)';
                jctx.lineWidth = 2;
                jctx.stroke();
                
                if (dist >= DEAD_ZONE) {
                    const ang = Math.atan2(dy, dx);
                    const half = Math.PI / 4; // 90° 扇形 => 半角 45°
                    
                    // 高亮 90° 扇形圆周弧
                    jctx.beginPath();
                    jctx.arc(centerX, centerY, RADIUS, ang - half, ang + half);
                    jctx.strokeStyle = 'rgba(139,195,74,0.95)';
                    jctx.lineWidth = 5;
                    jctx.lineCap = 'round';
                    jctx.stroke();
                    
                    // 圆周上的方向小箭头（位于弧中点 = 手指方向）
                    const ax = centerX + Math.cos(ang) * RADIUS;
                    const ay = centerY + Math.sin(ang) * RADIUS;
                    const size = 12;
                    jctx.save();
                    jctx.translate(ax, ay);
                    jctx.rotate(ang);
                    jctx.beginPath();
                    jctx.moveTo(size, 0);
                    jctx.lineTo(-size * 0.6, -size * 0.7);
                    jctx.lineTo(-size * 0.6, size * 0.7);
                    jctx.closePath();
                    jctx.fillStyle = '#8BC34A';
                    jctx.fill();
                    jctx.restore();
                }
                
                // 摇杆中心点
                jctx.beginPath();
                jctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
                jctx.fillStyle = 'rgba(255,255,255,0.6)';
                jctx.fill();
            }
            
            function loop() {
                render();
                requestAnimationFrame(loop);
            }
            loop();
            
            function start(clientX, clientY) {
                const p = clientToCanvas(clientX, clientY);
                centerX = p.x; centerY = p.y;
                curX = p.x; curY = p.y;
                active = true;
            }
            function move(clientX, clientY) {
                if (!active) return;
                const p = clientToCanvas(clientX, clientY);
                curX = p.x; curY = p.y;
                updateDirection(curX - centerX, curY - centerY);
            }
            function end() {
                active = false;
                releaseAll();
            }
            
            // 触摸事件
            zone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const t = e.changedTouches[0];
                start(t.clientX, t.clientY);
            }, { passive: false });
            zone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                const t = e.changedTouches[0];
                move(t.clientX, t.clientY);
            }, { passive: false });
            zone.addEventListener('touchend', (e) => { e.preventDefault(); end(); }, { passive: false });
            zone.addEventListener('touchcancel', (e) => { e.preventDefault(); end(); }, { passive: false });
            
            // 鼠标兼容（桌面测试）
            zone.addEventListener('mousedown', (e) => { start(e.clientX, e.clientY); });
            window.addEventListener('mousemove', (e) => { if (active) move(e.clientX, e.clientY); });
            window.addEventListener('mouseup', () => { if (active) end(); });
        }
        
        function setupTouchControls() {
            const touchControls = document.getElementById('touch-controls');
            if (!touchControls) return;
            
            // 触屏设备才显示（也可在桌面用鼠标按下测试）
            const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            if (isTouch) {
                touchControls.classList.add('active');
            }
            
            // ===== 左下角虚拟摇杆 =====
            // 手指按住时显示一个 90° 扇形圆周 + 圆周上的方向小箭头，
            // 通过派发方向键事件复用 InputManager / MovementSystem。
            const dirKey = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
            
            function pressKey(key) {
                window.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
            }
            function releaseKey(key) {
                window.dispatchEvent(new KeyboardEvent('keyup', { key, bubbles: true }));
            }
            
            setupVirtualJoystick(pressKey, releaseKey, dirKey);
            
            // 功能按钮（技能 / 攻击 / 轻功 / 投掷 / 药品 / 背包 / 装备）
            function triggerAction(btn) {
                const currentScene = sceneManager ? sceneManager.getCurrentScene() : scene;
                if (!currentScene) return;
                if (btn.dataset.skill !== undefined) {
                    const idx = parseInt(btn.dataset.skill, 10);
                    // 复用框架场景的按索引释放技能（按角色朝向）
                    if (currentScene.useSkillByIndex) currentScene.useSkillByIndex(idx);
                } else if (btn.dataset.potion !== undefined) {
                    // 可使用物品：生命/魔法药水
                    if (currentScene.usePotionFromHotbar) currentScene.usePotionFromHotbar(btn.dataset.potion);
                } else if (btn.dataset.act === 'attack') {
                    // 攻击按钮现在走瞄准流程,此处不再触发
                } else if (btn.dataset.act === 'flight') {
                    if (currentScene.flightByFacing) currentScene.flightByFacing();
                } else if (btn.dataset.act === 'throw') {
                    if (currentScene.throwByFacing) currentScene.throwByFacing();
                } else if (btn.dataset.action === 'bag') {
                    if (currentScene.inventoryPanel) currentScene.inventoryPanel.toggle();
                } else if (btn.dataset.action === 'char') {
                    // 装备栏 = PlayerInfoPanel
                    if (currentScene.playerInfoPanel) currentScene.playerInfoPanel.toggle();
                }
            }
            
            // 点按型按键（交互 E / 前进 N）：派发一次完整的 keydown+keyup
            const keyMap = { e: 'e', n: 'n' };
            function tapKey(key) {
                window.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true }));
                // 稍后释放，确保 isKeyDown 在至少一帧内为 true
                setTimeout(() => {
                    window.dispatchEvent(new KeyboardEvent('keyup', { key, bubbles: true }));
                }, 160);
            }
            
            // 圆形动作按钮 + 底部快捷栏按钮，统一绑定
            // 用 lastTouchTime 防止触摸后浏览器合成的 mouse 事件造成"双触发"
            let lastTouchTime = 0;
            
            // ===== 技能瞄准系统（技能3/4/5：按住拖动选方向，松手释放） =====
            const skillAim = {
                active: false,      // 是否正在瞄准
                skillIndex: -1,     // 技能索引
                btn: null,          // 按下的按钮元素
                touchId: -1,        // 触摸点 identifier（区分多指）
                startX: 0,          // 按下时手指屏幕坐标
                startY: 0,
                curX: 0,            // 当前手指屏幕坐标
                curY: 0,
                radius: 100,        // 瞄准圆半径（像素，屏幕坐标）—— 拖拽此距离 = 最大射程
                anchorWorldPos: null, // 按下瞄准时的玩家世界坐标（锚点）
            };
            // 瞄准圆渲染(画在 joystick overlay canvas 上)
            const aimCvs = document.getElementById('joystick-overlay');
            const aimCtx = aimCvs ? aimCvs.getContext('2d') : null;
            
            function renderSkillAim() {
                // 瞄准圆绘制在 joystick overlay(已有 requestAnimationFrame loop)
                // 由摇杆 loop 调用此函数
            }
            // 把渲染钩入摇杆的 render loop：在 setupVirtualJoystick 的 loop 里
            // 无法直接改动闭包，所以我另起一个 raf loop 专门画瞄准圈
            function skillAimLoop() {
                if (aimCtx && skillAim.active) {
                    const sx = skillAim.startX;
                    const sy = skillAim.startY;
                    const cx = skillAim.curX;
                    const cy = skillAim.curY;
                    const dx = cx - sx;
                    const dy = cy - sy;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    // 在按钮中心画圆圈(屏幕坐标 → 需要用 getBoundingClientRect)
                    // 简化:直接在 overlay canvas 上用 canvas 像素坐标画
                    // 但 overlay canvas 是游戏画面像素坐标...
                    // 为了简便，在按钮上方叠一个临时的 DOM 圆圈
                }
                requestAnimationFrame(skillAimLoop);
            }
            // 不用 canvas 画,用 CSS 圆圈更简洁可靠（避开坐标换算）
            // 创建一个临时的瞄准指示 DOM 元素
            const aimIndicator = document.createElement('div');
            aimIndicator.id = 'skill-aim-indicator';
            aimIndicator.style.cssText = 'position:fixed;pointer-events:none;display:none;z-index:99999;';
            aimIndicator.innerHTML = '<div class="aim-ring"></div><div class="aim-arrow"></div>';
            document.body.appendChild(aimIndicator);
            
            // 对应 CSS（内联添加）
            const aimStyle = document.createElement('style');
            aimStyle.textContent = `
                #skill-aim-indicator {
                    width: 120px; height: 120px;
                    transform: translate(-50%, -50%);
                }
                #skill-aim-indicator .aim-ring {
                    position: absolute; inset: 0;
                    border: 3px solid rgba(139,195,74,0.85);
                    border-radius: 50%;
                }
                #skill-aim-indicator .aim-arrow {
                    position: absolute;
                    left: 50%; top: 50%;
                    width: 14px; height: 14px;
                    margin: -7px 0 0 -7px;
                    background: #8BC34A;
                    clip-path: polygon(100% 50%, 0 0, 0 100%);
                    transform-origin: center center;
                    transform: rotate(0deg) translateX(100px);
                    display: none;
                }
            `;
            document.head.appendChild(aimStyle);
            
            function startSkillAim(btn, skillIdx, clientX, clientY, touchId) {
                skillAim.active = true;
                skillAim.skillIndex = skillIdx;
                skillAim.btn = btn;
                skillAim.touchId = touchId !== undefined ? touchId : -1;
                skillAim.startX = clientX;
                skillAim.startY = clientY;
                skillAim.curX = clientX;
                skillAim.curY = clientY;
                // 记录瞄准开始时玩家世界坐标作为锚点
                const currentScene = sceneManager ? sceneManager.getCurrentScene() : scene;
                skillAim.anchorWorldPos = null;
                if (currentScene && currentScene.playerEntity) {
                    const t = currentScene.playerEntity.getComponent('transform');
                    if (t) skillAim.anchorWorldPos = { x: t.position.x, y: t.position.y };
                }
                // 显示瞄准圈在按钮中心
                aimIndicator.style.display = 'block';
                aimIndicator.style.left = clientX + 'px';
                aimIndicator.style.top = clientY + 'px';
                aimIndicator.querySelector('.aim-arrow').style.display = 'none';
                // 瞄准时让其他按钮不遮挡摇杆圈
                const actionBtns = document.getElementById('action-buttons');
                if (actionBtns) actionBtns.style.zIndex = '1';
                // 让被按的按钮自身半透明,不遮挡瞄准圈
                btn.style.opacity = '0.25';
                // 初始时落点在玩家自身(distRatio=0)
                if (currentScene && currentScene.setSkillAimPreview) {
                    currentScene.setSkillAimPreview(skillIdx, 1, 0, 0, skillAim.anchorWorldPos);
                }
            }
            
            function moveSkillAim(clientX, clientY) {
                if (!skillAim.active) return;
                skillAim.curX = clientX;
                skillAim.curY = clientY;
                const dx = clientX - skillAim.startX;
                const dy = clientY - skillAim.startY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const arrow = aimIndicator.querySelector('.aim-arrow');
                // 拖拽距离占瞄准圈半径的比例 → 映射到 0~1(=最大射程)
                const distRatio = dist / skillAim.radius;
                
                const currentScene = sceneManager ? sceneManager.getCurrentScene() : scene;
                
                // 始终按实际拖拽距离和方向更新（无死区，手指在中心附近也正常映射）
                if (dist > 2) {
                    const ang = Math.atan2(dy, dx) * 180 / Math.PI;
                    arrow.style.display = 'block';
                    arrow.style.transform = `rotate(${ang}deg) translateX(80px)`;
                    // 范围内绿色,范围外红色
                    const inRange = distRatio <= 1.0;
                    arrow.style.background = inRange ? '#8BC34A' : '#ff4444';
                    aimIndicator.querySelector('.aim-ring').style.borderColor =
                        inRange ? 'rgba(139,195,74,0.85)' : 'rgba(255,68,68,0.85)';
                    // 更新游戏世界中的技能落点预览
                    if (currentScene && currentScene.setSkillAimPreview) {
                        currentScene.setSkillAimPreview(skillAim.skillIndex, dx, dy, distRatio, skillAim.anchorWorldPos);
                    }
                    // 攻击按钮：拖动时让扇形方向跟随手指（不攻击，仅更新方向指示）
                    if (skillAim.skillIndex === ATTACK_AIM_INDEX && currentScene && currentScene.meleeAttackSystem) {
                        const ang = Math.atan2(dy, dx);
                        currentScene.meleeAttackSystem.sectorDirection = ang;
                        currentScene.meleeAttackSystem.sectorDirectionLocked = true;
                    }
                } else {
                    arrow.style.display = 'none';
                    // 距离极小:保持在玩家正前方极近处（使用上次方向或默认朝向）
                    if (currentScene && currentScene.setSkillAimPreview) {
                        currentScene.setSkillAimPreview(skillAim.skillIndex, dx || 1, dy || 0, distRatio, skillAim.anchorWorldPos);
                    }
                }
            }
            
            function endSkillAim() {
                if (!skillAim.active) return;
                const dx = skillAim.curX - skillAim.startX;
                const dy = skillAim.curY - skillAim.startY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const distRatio = dist / skillAim.radius;
                
                const currentScene = sceneManager ? sceneManager.getCurrentScene() : scene;
                if (currentScene) {
                    if (dist > 10 && distRatio <= 1.0) {
                        // 在范围内且有方向拖拽 → 释放
                        if (skillAim.skillIndex === ATTACK_AIM_INDEX) {
                            // 攻击按钮：从当前玩家位置到预览圈位置计算实际发射方向
                            if (currentScene.attackByDirection) {
                                // 如果有预览圈（远程），用预览圈世界坐标计算方向
                                if (currentScene.skillAimPreview && currentScene.playerEntity) {
                                    const t = currentScene.playerEntity.getComponent('transform');
                                    if (t) {
                                        const realDx = currentScene.skillAimPreview.targetX - t.position.x;
                                        const realDy = currentScene.skillAimPreview.targetY - t.position.y;
                                        currentScene.attackByDirection(realDx, realDy, distRatio);
                                    } else {
                                        currentScene.attackByDirection(dx, dy, distRatio);
                                    }
                                } else {
                                    currentScene.attackByDirection(dx, dy, distRatio);
                                }
                            }
                        } else {
                            // 技能按钮：使用预览圈世界坐标作为技能目标
                            if (currentScene.useSkillByDirection) {
                                let targetWorldPos = null;
                                if (currentScene.skillAimPreview) {
                                    targetWorldPos = {
                                        x: currentScene._lastAimWorldX || currentScene.skillAimPreview.targetX,
                                        y: currentScene._lastAimWorldY || currentScene.skillAimPreview.targetY
                                    };
                                }
                                currentScene.useSkillByDirection(skillAim.skillIndex, dx, dy, distRatio, targetWorldPos);
                            }
                        }
                    } else if (dist <= 10) {
                        // 没拖或拖动极小 → 按默认朝向释放
                        if (skillAim.skillIndex === ATTACK_AIM_INDEX) {
                            if (currentScene.attackByFacing) currentScene.attackByFacing();
                        } else {
                            if (currentScene.useSkillByIndex) {
                                currentScene.useSkillByIndex(skillAim.skillIndex);
                            }
                        }
                    }
                    // 超出范围(distRatio > 1.0 && dist > 10) → 不释放(取消)
                    
                    // 清除游戏世界中的落点预览
                    if (currentScene.clearSkillAimPreview) {
                        currentScene.clearSkillAimPreview();
                    }
                }
                
                // 隐藏
                skillAim.active = false;
                aimIndicator.style.display = 'none';
                if (skillAim.btn) {
                    skillAim.btn.classList.remove('pressed');
                    skillAim.btn.style.opacity = '';
                }
                // 恢复按钮组层级
                const actionBtns = document.getElementById('action-buttons');
                if (actionBtns) actionBtns.style.zIndex = '';
            }
            
            // 全局 touch/mouse move 用于技能瞄准拖拽
            window.addEventListener('touchmove', (e) => {
                if (!skillAim.active) return;
                // 用 touch identifier 找到瞄准手指
                for (let i = 0; i < e.touches.length; i++) {
                    if (e.touches[i].identifier === skillAim.touchId) {
                        moveSkillAim(e.touches[i].clientX, e.touches[i].clientY);
                        return;
                    }
                }
            }, { passive: true });
            window.addEventListener('mousemove', (e) => {
                if (skillAim.active) moveSkillAim(e.clientX, e.clientY);
            });
            window.addEventListener('touchend', (e) => {
                if (!skillAim.active) return;
                // 只有瞄准手指抬起才结束
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === skillAim.touchId) {
                        endSkillAim();
                        return;
                    }
                }
            });
            window.addEventListener('touchcancel', (e) => {
                if (!skillAim.active) return;
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === skillAim.touchId) {
                        endSkillAim();
                        return;
                    }
                }
            });
            window.addEventListener('mouseup', (e) => { if (skillAim.active) endSkillAim(); });
            
            // 需要瞄准的技能索引集合（技能3/4/5 = 索引 0/1/2）
            const AIM_SKILLS = new Set([0, 1, 2]);
            // 攻击按钮也走瞄准流程,用 -1 标识
            const ATTACK_AIM_INDEX = -1;
            
            document.querySelectorAll('.action-btn, .hotbar-btn').forEach(btn => {
                const isAimSkill = btn.dataset.skill !== undefined && AIM_SKILLS.has(parseInt(btn.dataset.skill, 10));
                const isAttackBtn = btn.dataset.act === 'attack';
                
                const doPress = (clientX, clientY, touchId) => {
                    btn.classList.add('pressed');
                    if (isAimSkill) {
                        // 进入技能瞄准模式
                        startSkillAim(btn, parseInt(btn.dataset.skill, 10), clientX, clientY, touchId);
                    } else if (isAttackBtn) {
                        // 交互模式（非战斗）不进入瞄准，直接派发交互键
                        if (btn.classList.contains('interact-mode')) {
                            tapKey('e');
                            tapKey('n');
                        } else {
                            // 攻击按钮进入瞄准模式
                            startSkillAim(btn, ATTACK_AIM_INDEX, clientX, clientY, touchId);
                        }
                    } else if (btn.dataset.key !== undefined) {
                        tapKey(keyMap[btn.dataset.key] || btn.dataset.key);
                    } else {
                        triggerAction(btn);
                    }
                };
                const onTouch = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    lastTouchTime = Date.now();
                    const t = e.changedTouches[0];
                    doPress(t.clientX, t.clientY, t.identifier);
                };
                const onMouse = (e) => {
                    if (Date.now() - lastTouchTime < 600) return;
                    e.preventDefault();
                    e.stopPropagation();
                    doPress(e.clientX, e.clientY, -1);
                };
                const release = (e) => {
                    e.preventDefault();
                    if ((isAimSkill || isAttackBtn) && skillAim.active) {
                        // 瞄准按钮释放由全局 touchend/mouseup 处理
                        return;
                    }
                    btn.classList.remove('pressed');
                };
                btn.addEventListener('touchstart', onTouch, { passive: false });
                btn.addEventListener('touchend', release, { passive: false });
                btn.addEventListener('touchcancel', release, { passive: false });
                btn.addEventListener('mousedown', onMouse);
                btn.addEventListener('mouseup', release);
            });
        }
        setupTouchControls();
        
        // ===== 应用 UI 编辑器保存的布局到触屏 DOM 按钮（百分比 → 相对 touch-controls 定位）=====
        // 编辑器用统一的"满画布坐标系"，而按钮原本嵌套在 #action-buttons / #bottom-hotbar 内，
        // 为让百分比直接生效，把可编辑按钮重挂到 #touch-controls 并用百分比定位。
        async function applyUILayoutToDom() {
            const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            if (!isTouch) return; // 仅移动端应用
            let layout;
            try {
                const res = await fetch('config/UILayout.mobile.json');
                if (!res.ok) return;
                layout = await res.json();
            } catch (e) { return; }
            if (!layout || !Array.isArray(layout.components)) return;
            
            const touchControls = document.getElementById('touch-controls');
            if (!touchControls) return;
            
            // 可编辑的 DOM 按钮 id（与编辑器组件 id 对应）
            const domIds = {
                'joystick': 'joystick-zone',
                'act-attack': 'act-attack',
                'act-skill3': 'act-skill3',
                'act-skill4': 'act-skill4',
                'act-skill5': 'act-skill5',
                'act-flight': 'act-flight',
                'act-throw': 'act-throw',
                'bottom-hotbar': 'bottom-hotbar'
            };
            
            for (const comp of layout.components) {
                const elId = domIds[comp.id];
                if (!elId || comp.xPct === undefined) continue;
                const el = document.getElementById(elId);
                if (!el) continue;
                // 重挂到 touch-controls，使百分比相对全屏容器
                if (el.parentElement !== touchControls) {
                    touchControls.appendChild(el);
                }
                el.style.position = 'absolute';
                el.style.left = (comp.xPct * 100).toFixed(3) + '%';
                el.style.top = (comp.yPct * 100).toFixed(3) + '%';
                el.style.width = (comp.wPct * 100).toFixed(3) + '%';
                el.style.height = (comp.hPct * 100).toFixed(3) + '%';
                el.style.right = 'auto';
                el.style.bottom = 'auto';
                el.style.maxWidth = 'none';
            }
        }
        applyUILayoutToDom();
        
        // ===== 竖屏时直接以横屏方式显示（不锁定方向，仅 CSS 旋转页面） =====
        // 当处于竖屏时给 body 加 .force-landscape，#game-container 被旋转 90° 填满屏幕。
        // 同时为 InputManager 安装坐标变换钩子，修正旋转后的触摸/点击坐标。
        function applyForceLandscape() {
            const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
            const portrait = window.innerHeight > window.innerWidth;
            const rotate = isTouch && portrait;
            const wasRotate = document.body.classList.contains('force-landscape');
            document.body.classList.toggle('force-landscape', rotate);
            // 旋转后容器尺寸变化，需等 CSS 生效后再重算 canvas 尺寸
            if (rotate !== wasRotate) {
                // 类名切换后延迟一帧让布局生效
                requestAnimationFrame(() => { resizeCanvas(); });
            } else {
                resizeCanvas();
            }
            return rotate;
        }
        
        // 坐标变换：把页面坐标映射回 canvas 像素坐标（考虑旋转 + 缩放）
        function makePointerTransform() {
            return (clientX, clientY) => {
                const rotate = document.body.classList.contains('force-landscape');
                const rect = canvas.getBoundingClientRect();
                if (!rotate) {
                    // 未旋转：标准映射
                    const sx = canvas.width / rect.width;
                    const sy = canvas.height / rect.height;
                    return { x: (clientX - rect.left) * sx, y: (clientY - rect.top) * sy };
                }
                // 旋转 90°（顺时针）：rect 是旋转后的外接矩形（屏幕坐标）
                // 屏幕内相对位置
                const px = clientX - rect.left;
                const py = clientY - rect.top;
                // 容器逻辑宽 = canvas.width，逻辑高 = canvas.height
                // 顺时针 90°：canvasX 沿屏幕竖直方向，canvasY 沿屏幕水平反方向
                const cx = py / rect.height * canvas.width;
                const cy = (rect.width - px) / rect.width * canvas.height;
                return { x: cx, y: cy };
            };
        }
        
        function setupOrientation() {
            const rotate = applyForceLandscape();
            // 安装坐标变换钩子到当前场景的 InputManager
            const transform = makePointerTransform();
            const installer = () => {
                const cs = sceneManager ? sceneManager.getCurrentScene() : null;
                if (cs && cs.inputManager && cs.inputManager.setPointerTransform) {
                    cs.inputManager.setPointerTransform(transform);
                }
            };
            installer();
            // 场景可能稍后才创建 InputManager，做几次补装
            setTimeout(installer, 500);
            setTimeout(installer, 1500);
            // 暴露给摇杆使用
            window.__pointerTransform = transform;
        }
        setupOrientation();
        window.addEventListener('resize', () => { applyForceLandscape(); });
        window.addEventListener('orientationchange', () => { setTimeout(setupOrientation, 100); });
        
        // 启动游戏
        initGame();
    </script>
</body>
</html>

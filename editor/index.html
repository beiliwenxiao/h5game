<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>游戏编辑器 - YiJian18-Engine Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #0a0a1e;
            color: #fff;
            min-height: 100vh;
        }
        
        /* 编辑器主容器 */
        .editor-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        /* 顶部导航 */
        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #16213e;
            border-bottom: 1px solid #2a3a5e;
        }
        
        .editor-header h1 {
            font-size: 18px;
            color: #4CAF50;
        }
        
        .editor-header nav {
            display: flex;
            gap: 10px;
        }
        
        .editor-header nav button {
            padding: 8px 16px;
            background: #3a4a7e;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
        }
        
        .editor-header nav button:hover {
            background: #4a5a9e;
        }
        
        .editor-header nav button.active {
            background: #4CAF50;
            color: #000;
        }

        /* 游戏选择器指示器 */
        .editor-game-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .game-indicator-label {
            font-size: 13px;
            color: #aaa;
        }
        .game-selector {
            padding: 6px 12px;
            background: #2a3a5e;
            border: 1px solid #4CAF50;
            border-radius: 4px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            min-width: 160px;
        }
        .game-selector:focus {
            outline: none;
            border-color: #66bb6a;
        }
        
        /* 主内容区 */
        .editor-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }
        
        /* 游戏列表页 */
        .game-list-page {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        
        .page-title {
            font-size: 24px;
            margin-bottom: 20px;
            color: #4CAF50;
        }
        
        .section-title {
            font-size: 18px;
            margin: 20px 0 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a3a5e;
        }
        
        /* 游戏卡片 */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .game-card {
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .game-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(76, 175, 80, 0.3);
        }
        
        .game-card-thumbnail {
            width: 100%;
            height: 160px;
            background: #2a3a5e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .game-card-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .game-card-thumbnail .placeholder {
            font-size: 48px;
            color: #4a5a8e;
        }
        
        .game-card-info {
            padding: 15px;
        }
        
        .game-card-info h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }
        
        .game-card-info p {
            font-size: 13px;
            color: #aaa;
            line-height: 1.5;
        }
        
        .game-card-actions {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }
        
        .game-card-actions button {
            flex: 1;
            padding: 8px;
            background: #3a4a7e;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
        }
        
        .game-card-actions button:hover {
            background: #4a5a9e;
        }
        
        .game-card-actions button.primary {
            background: #4CAF50;
            color: #000;
        }
        
        /* 新建游戏卡片 */
        .new-game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            background: #16213e;
            border: 2px dashed #3a4a7e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .new-game-card:hover {
            border-color: #4CAF50;
            background: #1a2a4e;
        }
        
        .new-game-card .icon {
            font-size: 48px;
            color: #4a5a8e;
            margin-bottom: 10px;
        }
        
        .new-game-card span {
            font-size: 14px;
            color: #aaa;
        }
        
        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal {
            background: #16213e;
            border-radius: 8px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .modal h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #4CAF50;
        }
        
        .modal-form .form-group {
            margin-bottom: 15px;
        }
        
        .modal-form label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #aaa;
        }
        
        .modal-form input,
        .modal-form textarea {
            width: 100%;
            padding: 10px;
            background: #2a3a5e;
            border: 1px solid #3a4a7e;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }
        
        .modal-form textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        
        .modal-actions button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .modal-actions button.cancel {
            background: #3a4a7e;
            color: #fff;
        }
        
        .modal-actions button.confirm {
            background: #4CAF50;
            color: #000;
        }
        
        /* 场景编辑器页 */
        .scene-editor-page {
            flex: 1;
            display: none;
        }
        
        .scene-editor-page.active {
            display: flex;
        }
        
        #scene-editor-container {
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }
        
        /* UI 编辑器页 */
        .ui-editor-page {
            flex: 1;
            display: none;
        }
        .ui-editor-page.active {
            display: flex;
        }
        #ui-editor-container {
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }
        
        /* 场景列表侧边栏 */
        .scene-sidebar {
            width: 250px;
            background: #16213e;
            border-right: 1px solid #2a3a5e;
            display: flex;
            flex-direction: column;
        }
        
        .scene-sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #2a3a5e;
        }
        
        .scene-sidebar-header h3 {
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .scene-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .scene-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin-bottom: 5px;
            background: #2a3a5e;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .scene-item:hover {
            background: #3a4a7e;
        }
        
        .scene-item.active {
            background: #4CAF50;
            color: #000;
        }
        
        .scene-item .scene-name {
            flex: 1;
        }
        
        .scene-item .scene-actions {
            display: flex;
            gap: 5px;
        }
        
        .scene-item .scene-actions button {
            padding: 3px 8px;
            background: rgba(0,0,0,0.2);
            border: none;
            border-radius: 3px;
            color: inherit;
            cursor: pointer;
            font-size: 11px;
        }

        .scene-drag-handle {
            cursor: grab;
            margin-right: 8px;
            color: #666;
            font-size: 14px;
            user-select: none;
        }

        .scene-item.drag-over {
            border-top: 2px solid #4CAF50;
        }
        
        .scene-sidebar-footer {
            padding: 10px;
            border-top: 1px solid #2a3a5e;
        }
        
        .scene-sidebar-footer button {
            width: 100%;
            padding: 10px;
            background: #3a4a7e;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
        }
        
        /* 图片分割工具模态框 */
        .slicer-modal {
            max-width: 1200px;
            width: 95%;
            height: 85vh;
        }
        
        .slicer-modal .modal-content {
            height: 100%;
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .game-grid {
                grid-template-columns: 1fr;
            }
            
            .editor-header {
                flex-direction: column;
                gap: 10px;
            }
            
            .scene-sidebar {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="editor-app">
        <!-- 顶部导航 -->
        <header class="editor-header">
            <h1>🎮 游戏编辑器</h1>
            <div class="editor-game-indicator" id="editor-game-indicator" style="display:none;">
                <span class="game-indicator-label">当前游戏：</span>
                <select id="game-selector" class="game-selector"></select>
            </div>
            <nav>
                <button id="nav-game-list" class="active">游戏列表</button>
                <button id="nav-scene-editor">场景编辑器</button>
                <button id="nav-ui-editor">UI编辑器</button>
                <button id="nav-trigger-editor">事件编辑器</button>
                <button id="nav-dialogue-editor">对话编辑器</button>
                <button id="nav-library-editor">内容库</button>
                <button id="nav-world-map-editor">大地图块编辑器</button>
                <button id="nav-panel-editor">面板编辑器</button>
                <button id="nav-system-editor">系统编辑器</button>
                <button id="nav-home">返回首页</button>
            </nav>
        </header>
        
        <!-- 主内容区 -->
        <main class="editor-content">
            <!-- 游戏列表页 -->
            <div class="game-list-page" id="game-list-page">
                <h2 class="page-title">游戏项目管理</h2>
                
                <h3 class="section-title">内置示例游戏</h3>
                <div class="game-grid" id="builtin-games-grid"></div>
                
                <h3 class="section-title">我的游戏</h3>
                <div class="game-grid" id="custom-games-grid">
                    <!-- 新建游戏卡片 -->
                    <div class="new-game-card" id="new-game-btn">
                        <div class="icon">+</div>
                        <span>创建新游戏</span>
                    </div>
                </div>
            </div>
            
            <!-- 场景编辑器页 -->
            <div class="scene-editor-page" id="scene-editor-page">
                <div class="scene-sidebar">
                    <div class="scene-sidebar-header">
                        <h3>场景列表</h3>
                        <div id="current-game-name">未选择游戏</div>
                    </div>
                    <div style="padding:4px 8px;border-bottom:1px solid #333;display:flex;gap:4px;align-items:center;">
                        <select id="scene-filter-type" style="flex:1;padding:2px 4px;font-size:12px;background:#2a2a2a;color:#ccc;border:1px solid #444;border-radius:3px;">
                            <option value="all">所有场景</option>
                            <option value="worldChunk">大地图块</option>
                            <option value="standalone">独立场景</option>
                            <option value="template">场景模板</option>
                        </select>
                        <select id="scene-filter-worldmap" style="flex:1;padding:2px 4px;font-size:12px;background:#2a2a2a;color:#ccc;border:1px solid #444;border-radius:3px;display:none;">
                        </select>
                    </div>
                    <div class="scene-list" id="scene-list"></div>
                    <div class="scene-sidebar-footer">
                        <button id="new-scene-btn">+ 新建场景</button>
                        <button id="new-template-btn" title="新建场景模板">+ 新建场景模板</button>
                    </div>
                </div>
                <div id="scene-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>
            
            <!-- UI 编辑器页 -->
            <div class="ui-editor-page" id="ui-editor-page">
                <div id="ui-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>

            <!-- 事件编辑器页 -->
            <div class="ui-editor-page" id="trigger-editor-page">
                <div id="trigger-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>

            <!-- 内容库编辑器页 -->
            <div class="ui-editor-page" id="library-editor-page">
                <div id="library-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>

            <!-- 对话编辑器页 -->
            <div class="ui-editor-page" id="dialogue-editor-page">
                <div id="dialogue-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>

            <!-- 大地图块编辑器页 -->
            <div class="ui-editor-page" id="world-map-editor-page" style="overflow:auto;min-width:0;">
                <div id="world-map-editor-container" style="min-height:0;padding:16px;"></div>
            </div>

            <!-- 面板编辑器页 -->
            <div class="ui-editor-page" id="panel-editor-page">
                <div id="panel-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>

            <!-- 系统编辑器页 -->
            <div class="ui-editor-page" id="system-editor-page">
                <div id="system-editor-container" style="flex:1;overflow:hidden;min-height:0;"></div>
            </div>
        </main>
    </div>
    
    <!-- 新建游戏模态框 -->
    <div class="modal-overlay" id="new-game-modal">
        <div class="modal">
            <h2>创建新游戏</h2>
            <form class="modal-form" id="new-game-form">
                <div class="form-group">
                    <label>游戏名称 *</label>
                    <input type="text" id="game-name" required placeholder="输入游戏名称">
                </div>
                <div class="form-group">
                    <label>游戏描述</label>
                    <textarea id="game-description" placeholder="简要描述你的游戏"></textarea>
                </div>
                <div class="form-group">
                    <label>缩略图</label>
                    <input type="file" id="game-thumbnail" accept="image/*">
                </div>
            </form>
            <div class="modal-actions">
                <button class="cancel" id="cancel-new-game">取消</button>
                <button class="confirm" id="confirm-new-game">创建</button>
            </div>
        </div>
    </div>
    
    <!-- 新建场景模态框 -->
    <div class="modal-overlay" id="new-scene-modal">
        <div class="modal">
            <h2>创建新场景</h2>
            <form class="modal-form" id="new-scene-form">
                <div class="form-group">
                    <label>场景名称 *</label>
                    <input type="text" id="scene-name" required placeholder="输入场景名称">
                </div>
                <div class="form-group">
                    <label>场景模板</label>
                    <select id="scene-template"></select>
                    <div id="scene-template-desc" style="margin-top:4px;font-size:12px;color:#888;"></div>
                </div>
                <div class="form-group">
                    <label>场景宽度</label>
                    <input type="number" id="scene-width" value="1280" min="100">
                </div>
                <div class="form-group">
                    <label>场景高度</label>
                    <input type="number" id="scene-height" value="720" min="100">
                </div>
                <div class="form-group">
                    <label>背景颜色</label>
                    <input type="color" id="scene-bg-color" value="#2a3a1a">
                </div>
            </form>
            <div class="modal-actions">
                <button class="cancel" id="cancel-new-scene">取消</button>
                <button class="confirm" id="confirm-new-scene">创建</button>
            </div>
        </div>
    </div>


    
    <!-- 图片分割工具模态框 -->
    <div class="modal-overlay" id="slicer-modal">
        <div class="modal slicer-modal">
            <div class="modal-content" id="slicer-container"></div>
        </div>
    </div>

    <script type="module">
        import { EditorDataManager, loadBuiltinGamesConfig, loadScenePresetsConfig, loadSceneTemplatesConfig } from './EditorDataManager.js';
        import { SceneEditor, loadEditorDefaults } from './SceneEditor.js';
        import { ImageSlicer } from './ImageSlicer.js';
        import { SceneDataLoader } from './SceneDataLoader.js';
        import { UIEditor } from './UIEditor.js';
        import { TriggerEditor } from './TriggerEditor.js';
        import { LibraryEditor } from './LibraryEditor.js';
        import { DialogueGraphEditor } from './DialogueGraphEditor.js';
        import { WorldMapEditor } from './WorldMapEditor.js';
        import { PanelEditor } from './PanelEditor.js';
        import { SystemEditor } from './SystemEditor.js';
        
        class GameEditor {
            constructor() {
                this.dataManager = new EditorDataManager();
                this.sceneLoader = new SceneDataLoader();
                this.sceneEditor = null;
                this.uiEditor = null;
                this.triggerEditor = null;
                this.libraryEditor = null;
                this.dialogueEditor = null;
                this.imageSlicer = null;
                this.currentGameId = null;
                this.currentSceneId = null;
                
                this._initAsync();
            }
            
            async _initAsync() {
                // 先加载所有 JSON 配置
                await Promise.all([
                    loadEditorDefaults(),
                    loadBuiltinGamesConfig(),
                    loadScenePresetsConfig(),
                    loadSceneTemplatesConfig()
                ]);
                // 用加载的配置初始化数据管理器
                await this.dataManager.init();
                
                this.init();
            }
            
            init() {
                this.renderBuiltinGames();
                this.renderCustomGames();
                this.bindEvents();
            }
            
            // 渲染内置游戏
            renderBuiltinGames() {
                const grid = document.getElementById('builtin-games-grid');
                const games = this.dataManager.getBuiltinGames();
                
                grid.innerHTML = games.map(game => `
                    <div class="game-card" data-id="${game.id}">
                        <div class="game-card-thumbnail">
                            <img src="${game.thumbnail}" alt="${game.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\\'placeholder\\'>🎮</div>'">
                        </div>
                        <div class="game-card-info">
                            <h3>${game.name}</h3>
                            <p>${game.description}</p>
                            <div class="game-card-actions">
                                <button class="primary" data-action="edit">编辑游戏</button>
                                <button data-action="play">运行游戏</button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
            
            // 渲染用户游戏
            renderCustomGames() {
                const grid = document.getElementById('custom-games-grid');
                const games = this.dataManager.getCustomGames();
                
                let html = games.map(game => `
                    <div class="game-card" data-id="${game.id}" data-custom="true">
                        <div class="game-card-thumbnail">
                            ${game.thumbnail 
                                ? `<img src="${game.thumbnail}" alt="${game.name}" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=\\'placeholder\\'>🎮</div>'">`
                                : '<div class="placeholder">🎮</div>'
                            }
                        </div>
                        <div class="game-card-info">
                            <h3>${game.name}</h3>
                            <p>${game.description || '暂无描述'}</p>
                            <div class="game-card-actions">
                                <button class="primary" data-action="edit">编辑</button>
                                <button data-action="delete">删除</button>
                            </div>
                        </div>
                    </div>
                `).join('');
                
                // 添加新建游戏卡片
                html += `
                    <div class="new-game-card" id="new-game-btn">
                        <div class="icon">+</div>
                        <span>创建新游戏</span>
                    </div>
                `;
                
                grid.innerHTML = html;
            }
            
            // 绑定事件
            bindEvents() {
                // 导航按钮
                document.getElementById('nav-game-list').addEventListener('click', () => this.showPage('game-list'));
                document.getElementById('nav-scene-editor').addEventListener('click', () => this.showPage('scene-editor'));
                document.getElementById('nav-ui-editor').addEventListener('click', () => this.showPage('ui-editor'));
                document.getElementById('nav-trigger-editor').addEventListener('click', () => this.showPage('trigger-editor'));
                document.getElementById('nav-library-editor').addEventListener('click', () => this.showPage('library-editor'));
                document.getElementById('nav-world-map-editor').addEventListener('click', () => this.showPage('world-map-editor'));
                document.getElementById('nav-dialogue-editor').addEventListener('click', () => this.showPage('dialogue-editor'));
                document.getElementById('nav-panel-editor').addEventListener('click', () => this.showPage('panel-editor'));
                document.getElementById('nav-system-editor').addEventListener('click', () => this.showPage('system-editor'));
                document.getElementById('nav-home').addEventListener('click', () => window.location.href = '../index.html');
                
                // 游戏卡片点击
                document.getElementById('builtin-games-grid').addEventListener('click', (e) => this.handleGameCardClick(e));
                document.getElementById('custom-games-grid').addEventListener('click', (e) => this.handleGameCardClick(e));
                
                // 新建游戏
                document.getElementById('new-game-btn').addEventListener('click', () => this.showModal('new-game-modal'));
                document.getElementById('cancel-new-game').addEventListener('click', () => this.hideModal('new-game-modal'));
                document.getElementById('confirm-new-game').addEventListener('click', () => this.createGame());
                
                // 新建场景
                document.getElementById('new-scene-btn').addEventListener('click', () => { this.populateSceneTemplates(); this.showModal('new-scene-modal'); });
                document.getElementById('cancel-new-scene').addEventListener('click', () => this.hideModal('new-scene-modal'));
                // 模板下拉切换：更新描述，并把模板的宽高/背景色回填到表单（用户仍可再改）
                document.getElementById('scene-template').addEventListener('change', () => this.onSceneTemplateChange());
                document.getElementById('confirm-new-scene').addEventListener('click', () => this.createScene());

                // 新建场景模板
                document.getElementById('new-template-btn').addEventListener('click', () => this.createNewTemplate());
                
                // 场景筛选器
                document.getElementById('scene-filter-type').addEventListener('change', (e) => {
                    const wmSelect = document.getElementById('scene-filter-worldmap');
                    if (e.target.value === 'worldChunk') {
                        wmSelect.style.display = '';
                        this._populateWorldMapFilter();
                    } else {
                        wmSelect.style.display = 'none';
                    }
                    if (this.currentGameId) this.renderSceneList(this.currentGameId);
                });
                document.getElementById('scene-filter-worldmap').addEventListener('change', () => {
                    if (this.currentGameId) this.renderSceneList(this.currentGameId);
                });

                // 图片分割工具关闭
                document.getElementById('slicer-modal').addEventListener('click', (e) => {
                    if (e.target.id === 'slicer-modal') this.hideModal('slicer-modal');
                });
            }
            
            // 处理游戏卡片点击
            handleGameCardClick(e) {
                const card = e.target.closest('.game-card');
                if (!card) return;
                
                const gameId = card.dataset.id;
                const action = e.target.dataset.action;
                
                if (action === 'edit') {
                    this.editGame(gameId);
                } else if (action === 'play') {
                    this.playGame(gameId);
                } else if (action === 'delete') {
                    this.deleteGame(gameId);
                }
            }
            
            // 编辑游戏
            async editGame(gameId) {
                this.currentGameId = gameId;
                this.currentSceneId = null;
                const game = this.dataManager.setCurrentGame(gameId);
                
                // 暴露当前游戏信息给资源模块使用
                window._editorCurrentGame = game;
                
                if (!game) return;
                
                // 首次使用时从 _scene_order.json 初始化场景列表
                await this.dataManager.initScenesFromFile(gameId);
                
                // 更新游戏选择器
                this._updateGameIndicator(gameId);
                
                document.getElementById('current-game-name').textContent = game.name;
                this.renderSceneList(gameId);
                this.showPage('scene-editor');
                
                // 初始化场景编辑器
                if (!this.sceneEditor) {
                    this.sceneEditor = new SceneEditor(document.getElementById('scene-editor-container'));
                    this.sceneEditor.onOpenSlicer = () => this.openSlicer();
                    this.sceneEditor.onSceneChange = (data) => this.saveScene(data);
                    this.sceneEditor.onClearCache = () => this.clearSceneCache();
                    this.sceneEditor.onSceneMetaChange = (meta) => this._handleSceneMetaChange(meta);
                }
                
                // 触发resize以正确显示编辑器
                setTimeout(() => {
                    window.dispatchEvent(new Event('resize'));
                }, 100);
            }
            
            // 运行游戏
            playGame(gameId) {
                const game = this.dataManager.getAllGames().find(g => g.id === gameId);
                if (game && game.path) {
                    window.open(game.path + 'index.html', '_blank');
                }
            }
            
            // 删除游戏
            deleteGame(gameId) {
                if (confirm('确定要删除这个游戏吗？此操作不可撤销。')) {
                    this.dataManager.deleteGame(gameId);
                    this.renderCustomGames();
                }
            }
            
            // 创建游戏
            createGame() {
                const name = document.getElementById('game-name').value.trim();
                if (!name) {
                    alert('请输入游戏名称');
                    return;
                }
                
                const description = document.getElementById('game-description').value.trim();
                const thumbnailFile = document.getElementById('game-thumbnail').files[0];
                
                const game = this.dataManager.createGame({ name, description });
                
                if (thumbnailFile) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        game.thumbnail = e.target.result;
                        this.dataManager.updateGame(game.id, { thumbnail: game.thumbnail });
                        this.renderCustomGames();
                    };
                    reader.readAsDataURL(thumbnailFile);
                } else {
                    this.renderCustomGames();
                }
                
                this.hideModal('new-game-modal');
                document.getElementById('new-game-form').reset();
            }
            
            // 渲染场景列表
            renderSceneList(gameId) {
                let scenes = this.dataManager.getGameScenes(gameId);
                const list = document.getElementById('scene-list');
                
                // 筛选逻辑
                const filterType = document.getElementById('scene-filter-type')?.value || 'all';
                const filterWorldMap = document.getElementById('scene-filter-worldmap')?.value || '';
                // 「场景模板」筛选：列表只显示模板项
                if (filterType === 'template') {
                    list.innerHTML = this._buildTemplateSectionHtml();
                    this._bindTemplateItems(list);
                    return;
                }
                if (filterType === 'worldChunk') {
                    scenes = scenes.filter(s => s.sceneType === 'worldChunk');
                    if (filterWorldMap) scenes = scenes.filter(s => s.worldMap === filterWorldMap);
                } else if (filterType === 'standalone') {
                    scenes = scenes.filter(s => s.sceneType === 'standalone' || (!s.sceneType && !s.worldMap));
                }
                
                if (scenes.length === 0) {
                    list.innerHTML = '<div style="padding:15px;color:#666;text-align:center;">暂无场景，请创建新场景</div>';
                    return;
                }

                // 按已保存的排序顺序排列（无保存时按名称排序）
                const orderKey = `yijian18-engine_scene_order_${gameId}`;
                let savedOrder = null;
                try { savedOrder = JSON.parse(localStorage.getItem(orderKey)); } catch(e) {}
                // localStorage 无数据时，从 JSON 文件异步加载（首次渲染先用名称排序）
                if (!Array.isArray(savedOrder) || savedOrder.length === 0) {
                    const game = this.dataManager.getCurrentGame();
                    const gamePath = game ? game.path : '../example/sanguo_zhangjiao/';
                    const filePath = `${gamePath}assets/scenes/_scene_order.json`.replace(/^\.\.\//, '');
                    fetch(filePath).then(r => r.ok ? r.json() : null).then(data => {
                        if (data && Array.isArray(data.order) && data.order.length > 0) {
                            localStorage.setItem(orderKey, JSON.stringify(data.order));
                            this.renderSceneList(gameId); // 重新渲染
                        }
                    }).catch(() => {});
                }
                if (Array.isArray(savedOrder) && savedOrder.length > 0) {
                    const orderMap = new Map(savedOrder.map((id, idx) => [id, idx]));
                    scenes.sort((a, b) => {
                        const ia = orderMap.has(a.id) ? orderMap.get(a.id) : 9999;
                        const ib = orderMap.has(b.id) ? orderMap.get(b.id) : 9999;
                        return ia - ib;
                    });
                } else {
                    scenes.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'zh-CN'));
                }
                
                list.innerHTML = scenes.map(scene => `
                    <div class="scene-item ${scene.id === this.currentSceneId ? 'active' : ''}" data-id="${scene.id}" draggable="true">
                        <span class="scene-drag-handle">⋮⋮</span>
                        <span class="scene-name">${scene.name}</span>
                        <div class="scene-actions">
                            <button data-action="edit">编辑</button>
                            <button data-action="delete">×</button>
                        </div>
                    </div>
                `).join('');
                
                // 绑定场景点击事件
                list.querySelectorAll('.scene-item:not(.template-item)').forEach(item => {
                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const action = e.target.dataset.action;
                        const sceneId = item.dataset.id;
                        
                        if (action === 'edit') {
                            this.editScene(sceneId);
                        } else if (action === 'delete') {
                            this.deleteScene(sceneId);
                        } else {
                            this.editScene(sceneId);
                        }
                    });
                });

                // 拖拽排序（仅普通场景项参与，排除模板项）
                let dragItem = null;
                list.querySelectorAll('.scene-item:not(.template-item)').forEach(item => {
                    item.addEventListener('dragstart', (e) => {
                        dragItem = item;
                        item.style.opacity = '0.4';
                        e.dataTransfer.effectAllowed = 'move';
                    });
                    item.addEventListener('dragend', () => {
                        item.style.opacity = '1';
                        dragItem = null;
                        list.querySelectorAll('.scene-item:not(.template-item)').forEach(el => el.classList.remove('drag-over'));
                        // 保存新顺序到 localStorage 和 JSON 文件（排除模板项）
                        const newOrder = [...list.querySelectorAll('.scene-item:not(.template-item)')].map(el => el.dataset.id);
                        localStorage.setItem(orderKey, JSON.stringify(newOrder));
                        this._saveSceneOrder(gameId, newOrder);
                    });
                    item.addEventListener('dragover', (e) => {
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                        if (item !== dragItem) item.classList.add('drag-over');
                    });
                    item.addEventListener('dragleave', () => {
                        item.classList.remove('drag-over');
                    });
                    item.addEventListener('drop', (e) => {
                        e.preventDefault();
                        item.classList.remove('drag-over');
                        if (dragItem && dragItem !== item) {
                            // 在 DOM 中重新排列
                            const items = [...list.querySelectorAll('.scene-item:not(.template-item)')];
                            const fromIdx = items.indexOf(dragItem);
                            const toIdx = items.indexOf(item);
                            if (fromIdx < toIdx) {
                                item.after(dragItem);
                            } else {
                                item.before(dragItem);
                            }
                        }
                    });
                });
            }

            // 填充世界地图筛选下拉（从 game.project.json 读 regions）
            async _populateWorldMapFilter() {
                const select = document.getElementById('scene-filter-worldmap');
                if (!select) return;
                select.innerHTML = '<option value="">所有地图</option>';
                const game = this.dataManager.getCurrentGame();
                const gamePath = game ? game.path : '../example/sanguo_zhangjiao/';
                const projectPath = `${gamePath}game.project.json`.replace(/^\.\.\//, '');
                try {
                    const res = await fetch('/api/read-file?path=' + encodeURIComponent(projectPath));
                    if (!res.ok) return;
                    const data = await res.json();
                    const project = (data && data.ok && data.content) ? JSON.parse(data.content) : null;
                    if (!project || !project.worldMap || !project.worldMap.regions) return;
                    for (const region of project.worldMap.regions) {
                        const opt = document.createElement('option');
                        opt.value = region.id;
                        opt.textContent = region.name || region.id;
                        select.appendChild(opt);
                    }
                } catch (e) { /* ignore */ }
            }
            
            // 编辑场景
            async editScene(sceneId) {
                this.currentSceneId = sceneId;
                // 退出模板编辑态（编辑的是普通游戏场景）
                this._editingTemplateId = null;
                
                // 确保场景编辑器已初始化
                if (!this.sceneEditor) {
                    this.sceneEditor = new SceneEditor(document.getElementById('scene-editor-container'));
                    this.sceneEditor.onOpenSlicer = () => this.openSlicer();
                    this.sceneEditor.onSceneChange = (data) => this.saveScene(data);
                    this.sceneEditor.onClearCache = () => this.clearSceneCache();
                    this.sceneEditor.onSceneMetaChange = (meta) => this._handleSceneMetaChange(meta);
                }
                
                // 先尝试加载预设场景作为基底（提供 terrain / atlases / decoSprites 等完整字段）
                let presetScene = null;
                try {
                    presetScene = await this.sceneLoader.loadScene(sceneId);
                } catch (e) {
                    console.warn('加载预设场景失败:', e);
                }
                
                // 再读取本地存储中已保存的场景数据
                let saved = this.dataManager.setCurrentScene(sceneId);

                // localStorage 中只有元信息（无 layers）时，视为未加载，需从文件恢复
                if (saved && !saved.layers) {
                    saved = null;
                }

                // localStorage 无数据时，从导出的场景 JSON 文件兜底加载（避免清缓存后丢失编辑）
                if (!saved) {
                    saved = await this._loadSceneFromFile(sceneId, presetScene);
                    if (saved) {
                        // 回写 localStorage，恢复编辑态
                        this.dataManager.updateScene(this.currentGameId, sceneId, saved);
                        this.dataManager.setCurrentScene(sceneId);
                    }
                }
                
                let sceneToLoad;
                if (presetScene && saved) {
                    // 合并：预设提供完整字段，保存数据覆盖用户编辑过的内容
                    sceneToLoad = {
                        ...presetScene,
                        ...saved,
                        // 关键地形字段缺失时回退到预设，避免空白
                        terrain: saved.terrain || presetScene.terrain,
                        atlases: (saved.atlases && saved.atlases.length) ? saved.atlases : presetScene.atlases,
                        decoSprites: saved.decoSprites || presetScene.decoSprites,
                        // decorations 为空时回退到预设的程序化装饰物
                        decorations: (saved.decorations && saved.decorations.length) ? saved.decorations : presetScene.decorations,
                        centerX: saved.centerX ?? presetScene.centerX,
                        centerY: saved.centerY ?? presetScene.centerY,
                        basinRadius: saved.basinRadius ?? presetScene.basinRadius,
                        basinAspectY: saved.basinAspectY ?? presetScene.basinAspectY
                    };
                } else if (saved) {
                    sceneToLoad = saved;
                } else if (presetScene) {
                    sceneToLoad = presetScene;
                } else {
                    sceneToLoad = {
                        id: sceneId,
                        name: sceneId.replace('scene_', '').replace('_', ' '),
                        width: 1280,
                        height: 720,
                        backgroundColor: '#2a3a1a'
                    };
                }
                
                this.sceneEditor.loadScene(sceneToLoad);
                
                // 同步触发器到场景（从 game.project.json 中未在场景放置的触发器自动创建对象）
                this._syncTriggersToScene(sceneId);
                
                // 加载地形图集
                if (sceneToLoad.terrain && sceneToLoad.terrain.image) {
                    this.loadTerrainAtlas(sceneToLoad.terrain.image);
                }

                // 计算相邻场景数据（大地图多场景编辑参考）
                this._setupNeighborScenes(sceneId);
                
                this.renderSceneList(this.currentGameId);
                
                // 触发resize以正确显示编辑器
                setTimeout(() => {
                    window.dispatchEvent(new Event('resize'));
                }, 50);
            }
            
            // 计算相邻场景数据，供多场景编辑参考
            async _setupNeighborScenes(currentSceneId) {
                if (!this.sceneEditor) return;
                this.sceneEditor.neighborScenes = [];

                // 从 game.project.json 的 worldMap 读取 grid
                const gameId = this.currentGameId || 'sanguo_zhangjiao';
                let worldMap = null;
                try {
                    const res = await fetch(`../example/${gameId}/game.project.json`);
                    const proj = await res.json();
                    worldMap = proj && proj.worldMap;
                } catch (e) { return; }
                if (!worldMap || !worldMap.regions || !worldMap.regions[0]) return;

                const region = worldMap.regions[0];
                const { chunkWidth, chunkHeight, cols, rows, grid } = region;
                if (!grid) return;

                // 找到当前场景在 grid 中的位置
                let myCol = -1, myRow = -1;
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (grid[r] && grid[r][c] === currentSceneId) {
                            myCol = c; myRow = r;
                        }
                    }
                }
                if (myCol === -1) return;

                // 收集九宫格内的相邻场景
                const neighbors = [];
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const r = myRow + dr, c = myCol + dc;
                        if (r < 0 || r >= rows || c < 0 || c >= cols) continue;
                        const nId = grid[r] && grid[r][c];
                        if (!nId) continue;

                        // 加载邻居场景数据
                        let nScene = null;
                        const saved = this.dataManager.loadScenesData(gameId) || [];
                        nScene = saved.find(s => s.id === nId);
                        if (!nScene) {
                            try {
                                nScene = await this.sceneLoader.loadScene(nId);
                            } catch (e) {}
                        }
                        if (nScene) {
                            neighbors.push({
                                sceneData: nScene,
                                offsetX: dc * chunkWidth,
                                offsetY: dr * chunkHeight
                            });
                        }
                    }
                }

                this.sceneEditor.neighborScenes = neighbors;
                if (this.sceneEditor.showNeighbors) this.sceneEditor.render();
            }

            // localStorage 无数据时，从导出的场景 JSON 文件加载（选项2：清缓存不丢数据）
            async _loadSceneFromFile(sceneId, presetScene) {
                const gameId = this.currentGameId || 'sanguo_zhangjiao';
                const name = (presetScene && presetScene.name) || sceneId;
                
                // 优先用 sceneId 作为文件名，再用 name（处理 id 和文件名不一致的情况）
                const candidates = [sceneId];
                if (name !== sceneId) candidates.push(name);
                
                for (const filename of candidates) {
                    const path = `example/${gameId}/assets/scenes/${filename}.json`;
                    try {
                        const res = await fetch('/api/read-file?path=' + encodeURIComponent(path));
                        const data = await res.json();
                        if (data && data.ok && data.content) {
                            const parsed = JSON.parse(data.content);
                            const scenes = Array.isArray(parsed) ? parsed : [parsed];
                            const s = scenes.find(x => x && x.id === sceneId) || scenes[0];
                            if (s && s.layers) {
                                console.log('[Editor] 从文件恢复场景:', path);
                                return s;
                            }
                        }
                    } catch (e) {
                        // 继续尝试下一个候选文件名
                    }
                }
                console.warn('[Editor] 场景文件兜底加载失败，所有候选文件均无法匹配:', candidates);
                return null;
            }

            // 加载地形图集
            loadTerrainAtlas(imageUrl) {
                if (!this.sceneEditor) return;
                
                const img = new Image();
                img.onload = () => {
                    this.sceneEditor.loadedImages.set('terrain_atlas', img);
                    this.sceneEditor.render();
                };
                img.src = imageUrl;
            }
            
            // 填充"场景模板"下拉（打开新建场景弹窗时调用）
            populateSceneTemplates() {
                const sel = document.getElementById('scene-template');
                if (!sel) return;
                const { defaultTemplateId, templates } = this.dataManager.getSceneTemplates();
                sel.innerHTML = templates.map(t =>
                    `<option value="${t.id}">${t.name}</option>`
                ).join('');
                sel.value = defaultTemplateId;
                this.onSceneTemplateChange();
            }

            // 模板切换：显示描述，并把模板的宽高/背景色回填到表单（用户仍可再改）
            onSceneTemplateChange() {
                const sel = document.getElementById('scene-template');
                if (!sel) return;
                const tpl = this.dataManager.getSceneTemplate(sel.value);
                const descEl = document.getElementById('scene-template-desc');
                if (descEl) descEl.textContent = tpl ? (tpl.description || '') : '';
                if (tpl && tpl.scene) {
                    const s = tpl.scene;
                    if (s.width) document.getElementById('scene-width').value = s.width;
                    if (s.height) document.getElementById('scene-height').value = s.height;
                    if (s.backgroundColor) document.getElementById('scene-bg-color').value = s.backgroundColor;
                }
            }

            // 编辑模板：用场景编辑器打开模板的 scene 数据，保存时写回 scene-templates.json
            editSceneTemplate(templateId) {
                const tpl = this.dataManager.getSceneTemplate(templateId);
                if (!tpl) return;
                // 确保编辑器已初始化
                if (!this.sceneEditor) {
                    this.sceneEditor = new SceneEditor(document.getElementById('scene-editor-container'));
                    this.sceneEditor.onOpenSlicer = () => this.openSlicer();
                    this.sceneEditor.onSceneChange = (data) => this.saveScene(data);
                    this.sceneEditor.onClearCache = () => this.clearSceneCache();
                    this.sceneEditor.onSceneMetaChange = (meta) => this._handleSceneMetaChange(meta);
                }
                // 进入模板编辑态
                this._editingTemplateId = templateId;
                this.currentSceneId = null;
                const sceneToLoad = JSON.parse(JSON.stringify(tpl.scene || {}));
                sceneToLoad.id = templateId;
                sceneToLoad.name = tpl.name;
                // 让模板资源库与其他场景一致：聚合所有场景已有的图片资源
                // （全局图片库由 loadScene 内部 _mergeGlobalImages 再叠加一次）
                sceneToLoad.imageAssets = this._collectAllSceneImages(sceneToLoad.imageAssets);
                this.sceneEditor.loadScene(sceneToLoad);
                if (this.sceneEditor.ui && this.sceneEditor.ui.showToast) {
                    this.sceneEditor.ui.showToast('正在编辑模板「' + tpl.name + '」，保存将写回模板');
                }
                // 刷新左侧列表以高亮当前编辑的模板
                if (this.currentGameId) this.renderSceneList(this.currentGameId);
                window.dispatchEvent(new Event('resize'));
            }

            // 新建模板（克隆默认模板），随后进入编辑
            createNewTemplate() {
                const name = prompt('输入新模板名称：', '新模板');
                if (!name) return;
                const { template } = this.dataManager.createSceneTemplate({ name });
                this._saveTemplatesToFile();
                this.editSceneTemplate(template.id);
            }

            // 删除模板
            deleteTemplate(templateId) {
                const tpl = this.dataManager.getSceneTemplate(templateId);
                if (!tpl) return;
                if (!confirm('确定删除模板「' + tpl.name + '」？')) return;
                if (this._editingTemplateId === templateId) this._editingTemplateId = null;
                this.dataManager.deleteSceneTemplate(templateId);
                this._saveTemplatesToFile();
                // 刷新左侧列表
                if (this.currentGameId) this.renderSceneList(this.currentGameId);
            }

            // 把模板配置写回 editor/config/scene-templates.json
            _saveTemplatesToFile() {
                const cfg = this.dataManager.getSceneTemplatesConfig();
                const json = JSON.stringify(cfg, null, 2);
                fetch('/api/save-file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: 'editor/config/scene-templates.json', content: json })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.ok) console.log('场景模板已保存到文件:', data.path);
                    else console.warn('保存模板文件失败:', data.error);
                })
                .catch(err => console.warn('保存模板文件请求失败:', err));
            }

            // 聚合当前游戏所有场景的图片资源（imageAssets）为一个合集，
            // 使模板编辑时的资源库图片与其他场景一致（含在某个场景新加、但尚未写入全局 images.json 的图片）。
            _collectAllSceneImages(base = {}) {
                const merged = { ...(base || {}) };
                try {
                    const scenes = this.dataManager.loadScenesData(this.currentGameId) || [];
                    for (const s of scenes) {
                        if (s && s.imageAssets) {
                            for (const [id, data] of Object.entries(s.imageAssets)) {
                                if (!merged[id]) merged[id] = JSON.parse(JSON.stringify(data));
                            }
                        }
                    }
                } catch (e) {
                    console.warn('[模板] 聚合场景图片失败:', e);
                }
                return merged;
            }

            // 构建左侧列表底部的「场景模板」分组 HTML
            _buildTemplateSectionHtml() {
                const { templates } = this.dataManager.getSceneTemplates();
                const items = templates.map(t => `
                    <div class="scene-item template-item ${this._editingTemplateId === t.id ? 'active' : ''}" data-tpl-id="${t.id}" title="${t.description || ''}">
                        <span class="scene-name">📐 ${t.name}</span>
                        <div class="scene-actions">
                            <button data-tpl-action="edit">编辑</button>
                            <button data-tpl-action="delete">×</button>
                        </div>
                    </div>
                `).join('');
                return `
                    <div class="scene-template-section" style="margin-top:10px;border-top:1px solid #3a3a3a;padding-top:6px;">
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 8px;color:#8bc34a;font-size:12px;font-weight:bold;">
                            <span>场景模板</span>
                            <button id="inline-add-template" title="新建模板" style="padding:0 6px;">＋</button>
                        </div>
                        ${items || '<div style="padding:8px;color:#666;font-size:12px;text-align:center;">暂无模板</div>'}
                    </div>`;
            }

            // 绑定模板项的点击（编辑/删除）与新建模板按钮
            _bindTemplateItems(list) {
                list.querySelectorAll('.template-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const id = item.dataset.tplId;
                        const action = e.target.dataset.tplAction;
                        if (action === 'delete') this.deleteTemplate(id);
                        else this.editSceneTemplate(id);
                    });
                });
                const addBtn = list.querySelector('#inline-add-template');
                if (addBtn) addBtn.addEventListener('click', (e) => { e.stopPropagation(); this.createNewTemplate(); });
            }

            // 创建场景
            createScene() {
                const name = document.getElementById('scene-name').value.trim();
                if (!name) {
                    alert('请输入场景名称');
                    return;
                }
                
                const scene = this.dataManager.createScene(this.currentGameId, {
                    name,
                    templateId: document.getElementById('scene-template').value,
                    width: parseInt(document.getElementById('scene-width').value) || 1280,
                    height: parseInt(document.getElementById('scene-height').value) || 720,
                    backgroundColor: document.getElementById('scene-bg-color').value
                });
                
                this.hideModal('new-scene-modal');
                document.getElementById('new-scene-form').reset();
                this.renderSceneList(this.currentGameId);
                this.editScene(scene.id);
                // 同步更新 _scene_order.json 文件
                const scenes = this.dataManager.getGameScenes(this.currentGameId);
                const newOrder = scenes.map(s => s.id);
                this._saveSceneOrder(this.currentGameId, newOrder);
            }
            
            // 删除场景
            deleteScene(sceneId) {
                if (confirm('确定要删除这个场景吗？')) {
                    this.dataManager.deleteScene(this.currentGameId, sceneId);
                    if (this.currentSceneId === sceneId) {
                        this.currentSceneId = null;
                    }
                    this.renderSceneList(this.currentGameId);
                    // 同步更新 _scene_order.json 文件
                    const scenes = this.dataManager.getGameScenes(this.currentGameId);
                    const newOrder = scenes.map(s => s.id);
                    this._saveSceneOrder(this.currentGameId, newOrder);
                }
            }
            
            // 保存场景
            saveScene(sceneData) {
                // 模板编辑态：写回 scene-templates.json，而非游戏场景
                if (this._editingTemplateId) {
                    this.dataManager.upsertSceneTemplate(this._editingTemplateId, sceneData);
                    this._saveTemplatesToFile();
                    return;
                }
                if (!this.currentGameId || !this.currentSceneId) return;
                // 保存到 localStorage
                this.dataManager.updateScene(this.currentGameId, this.currentSceneId, sceneData);
                
                // 同时通过 API 写入 JSON 文件
                this._saveSceneToFile(sceneData);

                // 同步场景中的触发器到 game.project.json
                this._syncTriggersToProject(sceneData);
            }

            // 处理场景元数据变更（名称/ID）
            _handleSceneMetaChange(meta) {
                // 模板编辑态：只更新模板名称（模板 id 不允许改），写回 scene-templates.json
                if (this._editingTemplateId) {
                    if (meta.name !== undefined) {
                        this.dataManager.updateSceneTemplateMeta(this._editingTemplateId, { name: meta.name });
                        this._saveTemplatesToFile();
                        if (this.currentGameId) this.renderSceneList(this.currentGameId);
                    }
                    return;
                }
                if (!this.currentGameId || !this.currentSceneId) return;
                
                if (meta.id && meta.oldId) {
                    // 修改场景 ID
                    const success = this.dataManager.renameSceneId(this.currentGameId, meta.oldId, meta.id);
                    if (success) {
                        this.currentSceneId = meta.id;
                        this.renderSceneList(this.currentGameId);
                        // 同步更新 _scene_order.json
                        const scenes = this.dataManager.getGameScenes(this.currentGameId);
                        this._saveSceneOrder(this.currentGameId, scenes.map(s => s.id));
                    }
                } else if (meta.name !== undefined) {
                    // 修改场景名称
                    this.dataManager.updateSceneMeta(this.currentGameId, this.currentSceneId, { name: meta.name });
                    this.renderSceneList(this.currentGameId);
                    // 同步更新 _scene_order.json
                    const scenes = this.dataManager.getGameScenes(this.currentGameId);
                    this._saveSceneOrder(this.currentGameId, scenes.map(s => s.id));
                }
            }

            // 同步触发器到场景：从 game.project.json 中读取 triggers，
            // 如果触发器尚未在场景逻辑层中有对应 type:'trigger' 对象，则自动添加到 (10,10)
            async _syncTriggersToScene(sceneId) {
                if (!this.sceneEditor) return;
                const gameId = this.currentGameId || 'sanguo_zhangjiao';
                const game = this.dataManager.getCurrentGame();
                const gamePath = game ? game.path : '../example/sanguo_zhangjiao/';
                const projectPath = `${gamePath}game.project.json`.replace(/^\.\.\//, '');

                let triggers = [];
                try {
                    const res = await fetch('/api/read-file?path=' + encodeURIComponent(projectPath));
                    if (res.ok) {
                        const data = await res.json();
                        const project = typeof data.content === 'string' ? JSON.parse(data.content) : data;
                        triggers = project.triggers || [];
                    }
                } catch (e) { /* ignore */ }

                if (triggers.length === 0) return;

                const sceneData = this.sceneEditor.sceneData;
                if (!sceneData) return;

                // 确保逻辑层存在
                let logicLayer = sceneData.layers.find(l => l.id === 'layer_logic');
                if (!logicLayer) {
                    logicLayer = { id: 'layer_logic', name: '逻辑对象', visible: true, locked: false, objects: [] };
                    sceneData.layers.push(logicLayer);
                }
                if (!Array.isArray(logicLayer.objects)) logicLayer.objects = [];

                // 已存在的触发器 ID 集合
                const existingIds = new Set(
                    logicLayer.objects.filter(o => o.type === 'trigger').map(o => o.triggerId)
                );

                // 修正所有图层中已有触发器的大小为统一尺寸 36×36
                for (const layer of sceneData.layers) {
                    if (!Array.isArray(layer.objects)) continue;
                    for (const obj of layer.objects) {
                        if (obj.type === 'trigger') {
                            obj.width = 36;
                            obj.height = 36;
                        }
                    }
                }

                // 场景归属匹配：触发器的 scene 字段 或 when.params.sceneId 匹配当前编辑场景
                // 兼容 SceneManager 名（Act2Scene）和编辑器场景 ID（scene_Act2）的映射
                const sceneAliases = new Set([sceneId]);
                // 编辑器 sceneId (scene_Act2) → SceneManager 名 (Act2Scene) 的映射
                const chunkToAct = {
                    's0-1': 'Act1Scene', 'scene_Act2': 'Act2Scene', 'scene_Act3': 'Act3Scene',
                    'scene_Act4': 'Act4Scene', 'scene_Act5': 'Act5Scene', 'scene_Act6': 'Act6Scene'
                };
                const actToChunk = {
                    'Act1Scene': 's0-1', 'Act2Scene': 'scene_Act2', 'Act3Scene': 'scene_Act3',
                    'Act4Scene': 'scene_Act4', 'Act5Scene': 'scene_Act5', 'Act6Scene': 'scene_Act6'
                };
                if (chunkToAct[sceneId]) sceneAliases.add(chunkToAct[sceneId]);
                if (actToChunk[sceneId]) sceneAliases.add(actToChunk[sceneId]);

                // 判断触发器是否属于当前场景
                const belongsToScene = (trg) => {
                    // 1. 顶级 scene 字段（优先）
                    if (trg.scene) return sceneAliases.has(trg.scene);
                    // 2. when.params.sceneId
                    const trgSceneId = trg.when && trg.when.params && trg.when.params.sceneId;
                    if (trgSceneId) return sceneAliases.has(trgSceneId);
                    // 3. if 条件中的 sceneFlag 变量（如 "ddScene"、"act2Scene"）
                    const ifCond = trg.if;
                    if (ifCond && ifCond.op === '==' && ifCond.left && ifCond.left.var) {
                        const flagVar = ifCond.left.var;
                        // sceneFlag 命名规则：actXScene → ActXScene
                        const flagMap = {
                            'ddScene': 's0-1', 'act2Scene': 'scene_Act2', 'act3Scene': 'scene_Act3',
                            'act4Scene': 'scene_Act4', 'act5Scene': 'scene_Act5', 'act6Scene': 'scene_Act6'
                        };
                        if (flagMap[flagVar]) return sceneAliases.has(flagMap[flagVar]);
                    }
                    // 4. 无归属 → 全局触发器，只在 s0-0（通用/测试）场景显示
                    return sceneId === 's0-0';
                };

                // 移除不属于当前场景的触发器对象（清理之前无过滤时同步进来的）
                const triggerMap = new Map(triggers.map(t => [t.id, t]));
                for (const layer of sceneData.layers) {
                    if (!Array.isArray(layer.objects)) continue;
                    layer.objects = layer.objects.filter(obj => {
                        if (obj.type !== 'trigger' || !obj.triggerId) return true;
                        const trg = triggerMap.get(obj.triggerId);
                        if (!trg) return true; // 在 project 中找不到的保留（可能是手动创建的）
                        return belongsToScene(trg);
                    });
                }

                // 重新计算已存在的触发器 ID（移除后更新）
                existingIds.clear();
                for (const layer of sceneData.layers) {
                    if (!Array.isArray(layer.objects)) continue;
                    for (const obj of layer.objects) {
                        if (obj.type === 'trigger' && obj.triggerId) existingIds.add(obj.triggerId);
                    }
                }

                // 为 game.project.json 中属于当前场景且尚未放置的触发器创建默认对象
                let added = 0;
                let offsetY = 10;
                for (const trg of triggers) {
                    if (!trg.id || existingIds.has(trg.id)) continue;
                    if (!belongsToScene(trg)) continue;

                    logicLayer.objects.push({
                        id: 'trigger_' + Date.now() + '_' + (added++),
                        type: 'trigger',
                        name: trg.id,
                        triggerId: trg.id,
                        x: 10, y: offsetY,
                        width: 36, height: 36,
                        event: (trg.when && trg.when.type) || 'custom',
                        target: (trg.when && trg.when.params && trg.when.params.target) || '',
                        sceneId: (trg.when && trg.when.params && trg.when.params.sceneId) || '',
                        radius: 60,
                        conditions: trg.if ? JSON.stringify(trg.if) : '',
                        actions: Array.isArray(trg.do) ? trg.do.map(d => d.type || d).join(', ') : '',
                        once: !!trg.once,
                        cooldown: trg.cooldown || 0
                    });
                    offsetY += 46;
                }

                if (added > 0) {
                    this.sceneEditor.render();
                    console.log(`[Editor] 同步了 ${added} 个触发器到场景 ${sceneId}`);
                } else {
                    // 即使没新增，移除操作也可能改变了数据，刷新一下
                    this.sceneEditor.render();
                }
            }

            /**
             * 将场景中的触发器对象同步到 game.project.json 的 triggers 数组
             * 场景中新建的触发器如果在 project.triggers 中不存在，则自动添加
             */
            async _syncTriggersToProject(sceneData) {
                if (!sceneData || !Array.isArray(sceneData.layers)) return;
                const game = this.dataManager.getCurrentGame();
                const gamePath = game ? game.path : '../example/sanguo_zhangjiao/';
                const projectPath = `${gamePath}game.project.json`.replace(/^\.\.\//, '');

                // 收集场景中所有触发器对象
                const sceneTriggers = [];
                for (const layer of sceneData.layers) {
                    if (!Array.isArray(layer.objects)) continue;
                    for (const obj of layer.objects) {
                        if (obj.type === 'trigger' && obj.triggerId) {
                            sceneTriggers.push(obj);
                        }
                    }
                }
                if (sceneTriggers.length === 0) return;

                // 读取 game.project.json
                let project = null;
                try {
                    const res = await fetch('/api/read-file?path=' + encodeURIComponent(projectPath));
                    if (res.ok) {
                        const data = await res.json();
                        project = (data && data.ok && data.content) ? JSON.parse(data.content) : null;
                    }
                } catch (e) { return; }
                if (!project) return;
                if (!Array.isArray(project.triggers)) project.triggers = [];

                // 同步：场景中有但 project 中没有的触发器，添加到 project
                const existingIds = new Set(project.triggers.map(t => t.id));
                let added = 0;
                for (const obj of sceneTriggers) {
                    if (existingIds.has(obj.triggerId)) {
                        // 已存在：更新位置和基本信息
                        const existing = project.triggers.find(t => t.id === obj.triggerId);
                        if (existing) {
                            existing.when = existing.when || {};
                            existing.when.type = obj.event || existing.when.type || 'approach';
                            if (obj.target) {
                                existing.when.params = existing.when.params || {};
                                existing.when.params.target = obj.target;
                            }
                            if (obj.sceneId) {
                                existing.when.params = existing.when.params || {};
                                existing.when.params.sceneId = obj.sceneId;
                            }
                            if (obj.once !== undefined) existing.once = obj.once;
                            if (obj.cooldown) existing.cooldown = obj.cooldown;
                            // 同步动作
                            if (obj.actionType) {
                                let params = {};
                                if (obj.actionParams) {
                                    try { params = JSON.parse(obj.actionParams); } catch (e) { params = {}; }
                                }
                                // 更新 do 数组中第一个动作，或新建
                                if (!Array.isArray(existing.do)) existing.do = [];
                                if (existing.do.length > 0) {
                                    existing.do[0].action = obj.actionType;
                                    existing.do[0].params = params;
                                } else {
                                    existing.do.push({ action: obj.actionType, params });
                                }
                            }
                            // 同步条件
                            if (obj.conditions) {
                                try { existing.if = JSON.parse(obj.conditions); } catch (e) { existing.if = obj.conditions; }
                            }
                        }
                        continue;
                    }
                    // 新增触发器
                    const newTrg = {
                        id: obj.triggerId,
                        when: {
                            type: obj.event || 'approach',
                            params: {}
                        },
                        do: [],
                        once: !!obj.once
                    };
                    if (obj.target) newTrg.when.params.target = obj.target;
                    if (obj.sceneId) newTrg.when.params.sceneId = obj.sceneId;
                    if (obj.cooldown) newTrg.cooldown = obj.cooldown;
                    if (obj.actionType) {
                        let params = {};
                        if (obj.actionParams) {
                            try { params = JSON.parse(obj.actionParams); } catch (e) { params = {}; }
                        }
                        newTrg.do.push({ action: obj.actionType, params });
                    }
                    if (obj.conditions) {
                        try { newTrg.if = JSON.parse(obj.conditions); } catch (e) { newTrg.if = obj.conditions; }
                    }
                    project.triggers.push(newTrg);
                    added++;
                }

                if (added > 0 || sceneTriggers.length > 0) {
                    // 写回 game.project.json
                    try {
                        await fetch('/api/save-file', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ path: projectPath, content: JSON.stringify(project, null, 2) })
                        });
                        if (added > 0) console.log(`[Editor] 同步了 ${added} 个新触发器到 game.project.json`);
                    } catch (e) {
                        console.warn('[Editor] 同步触发器到工程文件失败:', e);
                    }
                }
            }

            // 清理本地 localStorage 缓存（下次从工程 JSON 文件重新加载；文件不受影响）
            clearSceneCache() {
                const gameId = this.currentGameId || 'sanguo_zhangjiao';
                if (!confirm('确定清理本地缓存？\n将删除 localStorage 中该游戏的场景编辑数据，随后从工程 JSON 文件重新加载（文件不受影响）。')) return;
                try {
                    localStorage.removeItem('yijian18-engine_editor_data_scenes_' + gameId);
                    console.log('[Editor] 已清理 localStorage 场景缓存:', gameId);
                } catch (e) {
                    console.warn('[Editor] 清理缓存失败:', e);
                }
                // 从工程文件重新加载当前场景（editScene 内已有文件兜底并回写 localStorage）
                if (this.currentSceneId) {
                    this.editScene(this.currentSceneId);
                }
                if (this.sceneEditor && this.sceneEditor.ui && this.sceneEditor.ui.showToast) {
                    this.sceneEditor.ui.showToast('已清理缓存，已从工程文件重新加载', 'success');
                } else {
                    alert('已清理缓存，已从工程文件重新加载场景。');
                }
            }
            
            // 将场景数据通过 dev server API 写入 JSON 文件
            _saveSceneToFile(sceneData) {
                const name = (sceneData.name || 'scene').replace(/[\\/:*?"<>|]/g, '_');
                const game = this.dataManager.getCurrentGame();
                const gamePath = game ? game.path : '../example/sanguo_zhangjiao/';
                // 保存到游戏的 assets/scenes/ 目录下
                const filePath = `${gamePath}assets/scenes/${name}.json`.replace(/^\.\.\//, '');
                
                const json = JSON.stringify(sceneData, null, 2);
                fetch('/api/save-file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: filePath, content: json })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        console.log('场景已保存到文件:', data.path);
                    } else {
                        console.warn('保存文件失败:', data.error);
                    }
                })
                .catch(err => console.warn('保存文件请求失败:', err));
            }

            // 保存场景排序到 JSON 文件
            _saveSceneOrder(gameId, order) {
                const game = this.dataManager.getCurrentGame();
                const gamePath = game ? game.path : '../example/sanguo_zhangjiao/';
                const filePath = `${gamePath}assets/scenes/_scene_order.json`.replace(/^\.\.\//, '');
                // 同时保存场景名称，便于首次加载时初始化场景列表
                const scenes = this.dataManager.getGameScenes(gameId);
                const sceneMap = {};
                for (const s of scenes) {
                    sceneMap[s.id] = { name: s.name, type: s.type || 'terrain' };
                }
                const json = JSON.stringify({ gameId, order, scenes: sceneMap }, null, 2);
                fetch('/api/save-file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: filePath, content: json })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.ok) console.log('场景排序已保存:', data.path);
                    else console.warn('保存排序失败:', data.error);
                })
                .catch(err => console.warn('保存排序请求失败:', err));
            }
            
            // 打开图片分割工具
            openSlicer() {
                this.showModal('slicer-modal');
                
                if (!this.imageSlicer) {
                    this.imageSlicer = new ImageSlicer(document.getElementById('slicer-container'));
                }
            }
            
            // 更新顶部游戏指示器（显示当前游戏并提供切换下拉）
            _updateGameIndicator(selectedGameId) {
                const indicator = document.getElementById('editor-game-indicator');
                const selector = document.getElementById('game-selector');
                const allGames = this.dataManager.getAllGames();
                
                // 填充下拉列表
                selector.innerHTML = allGames.map(g =>
                    `<option value="${g.id}" ${g.id === selectedGameId ? 'selected' : ''}>${g.name}</option>`
                ).join('');
                
                // 显示指示器
                indicator.style.display = 'flex';
                
                // 绑定切换事件（只绑一次）
                if (!this._gameSelectorBound) {
                    this._gameSelectorBound = true;
                    selector.addEventListener('change', (e) => {
                        const newGameId = e.target.value;
                        this._switchGame(newGameId);
                    });
                }
            }

            // 切换当前游戏（重新加载各子编辑器数据）
            async _switchGame(gameId) {
                this.currentGameId = gameId;
                this.currentSceneId = null;
                const game = this.dataManager.setCurrentGame(gameId);
                window._editorCurrentGame = game;
                if (!game) return;

                // 首次使用时从 _scene_order.json 初始化场景列表
                await this.dataManager.initScenesFromFile(gameId);

                document.getElementById('current-game-name').textContent = game.name;
                this.renderSceneList(gameId);

                // 销毁已有的子编辑器实例，下次打开时用新 gameId 重建
                if (this.uiEditor) { this.uiEditor = null; document.getElementById('ui-editor-container').innerHTML = ''; }
                if (this.triggerEditor) { this.triggerEditor = null; document.getElementById('trigger-editor-container').innerHTML = ''; }
                if (this.libraryEditor) { this.libraryEditor = null; document.getElementById('library-editor-container').innerHTML = ''; }
                if (this.dialogueEditor) { this.dialogueEditor = null; document.getElementById('dialogue-editor-container').innerHTML = ''; }

                // 重新触发当前活动页面的显示（用新 gameId 重新初始化对应编辑器）
                const activePage = this._getCurrentPage();
                if (activePage && activePage !== 'game-list') {
                    this.showPage(activePage);
                }

                console.log('[Editor] 切换游戏:', game.name, gameId);
            }

            // 获取当前活动页面标识
            _getCurrentPage() {
                if (document.getElementById('scene-editor-page').classList.contains('active')) return 'scene-editor';
